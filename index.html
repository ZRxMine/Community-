<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Join</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg: #070b16;
      --card: rgba(18, 25, 45, .82);
      --line: rgba(255,255,255,.12);
      --text: #f4f7ff;
      --muted: #9ba7c4;
      --blue: #6675ff;
      --purple: #a855f7;
      --green: #24d47b;
      --red: #ff5874;
      --yellow: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Vazirmatn", Tahoma, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(102,117,255,.22), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(168,85,247,.18), transparent 25%),
        linear-gradient(135deg, #070b16, #0c1021 55%, #080b17);
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: auto;
      padding: 24px 0 45px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 14px 22px;
      margin-bottom: 28px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(12, 17, 34, .75);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0,0,0,.42);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 900;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      font-size: 22px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
    }

    .user-label {
      color: var(--muted);
      font-size: 13px;
    }

    .user-label b {
      color: white;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: show .35s ease;
    }

    @keyframes show {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-box {
      width: min(560px, 100%);
      margin: 8vh auto 0;
      padding: 42px 34px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--card);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0,0,0,.42);
    }

    .login-logo {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 27px;
      font-size: 38px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
    }

    .login-box h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .login-box p {
      color: var(--muted);
      line-height: 2;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .input {
      width: 100%;
      padding: 15px 17px;
      color: white;
      outline: none;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.06);
      font-size: 14px;
    }

    .input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(102,117,255,.13);
    }

    textarea.input {
      resize: vertical;
      min-height: 115px;
    }

    .error {
      min-height: 25px;
      margin-top: 9px;
      color: #ff8295;
      font-size: 13px;
    }

    .btn {
      padding: 13px 19px;
      color: white;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 800;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue), var(--purple));
      box-shadow: 0 12px 30px rgba(102,117,255,.25);
    }

    .btn-green {
      color: #06150e;
      background: linear-gradient(135deg, #16b968, var(--green));
    }

    .btn-red {
      color: #ff91a4;
      background: rgba(255,88,116,.15);
      border: 1px solid rgba(255,88,116,.3);
    }

    .btn-dark {
      background: rgba(255,255,255,.07);
      border: 1px solid var(--line);
    }

    .page-title {
      margin-bottom: 22px;
    }

    .page-title h1 {
      margin: 0;
      font-size: 28px;
    }

    .page-title p {
      color: var(--muted);
      margin: 8px 0 0;
      font-size: 13px;
    }

    .search-area {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }

    .search-area .input {
      flex: 1;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 22px;
      align-items: start;
    }

    .panel {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 80px rgba(0,0,0,.42);
    }

    .panel h2 {
      margin: 0 0 17px;
      font-size: 18px;
    }

    .community-list {
      display: grid;
      gap: 13px;
    }

    .community-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: rgba(255,255,255,.045);
      transition: .2s;
    }

    .community-card:hover {
      transform: translateY(-3px);
      border-color: rgba(102,117,255,.65);
      background: rgba(102,117,255,.09);
    }

    .community-info {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .community-avatar {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 17px;
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(135deg, #5968ff, #b14cff);
    }

    .community-name {
      overflow: hidden;
      color: white;
      font-size: 16px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .community-description {
      max-width: 430px;
      overflow: hidden;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .community-meta {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .create-form {
      display: grid;
      gap: 12px;
    }

    .empty {
      padding: 35px 15px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 17px;
    }

    .success-banner {
      padding: 17px 20px;
      margin-bottom: 20px;
      color: #b9ffd8;
      font-weight: 800;
      border: 1px solid rgba(36,212,123,.3);
      border-radius: 18px;
      background: rgba(36,212,123,.1);
    }

    .back-btn {
      margin-bottom: 18px;
    }

    .detail-box {
      max-width: 820px;
      margin: 0 auto;
      padding: 34px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 25px 80px rgba(0,0,0,.42);
    }

    .detail-avatar {
      width: 100px;
      height: 100px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 30px;
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--blue), var(--purple));
    }

    .detail-box h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .detail-description {
      margin-bottom: 27px;
      color: var(--muted);
      line-height: 2;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 22px 0;
    }

    .stat {
      padding: 19px 10px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(255,255,255,.05);
    }

    .stat strong {
      display: block;
      margin-bottom: 5px;
      font-size: 24px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .rank-owner {
      color: var(--yellow) !important;
    }

    .rank-member {
      color: #8ab4ff !important;
    }

    .detail-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .user-label {
        display: none;
      }
    }

    @media (max-width: 550px) {
      .search-area {
        flex-direction: column;
      }

      .community-card {
        align-items: flex-start;
        flex-direction: column;
      }

      .community-card .btn {
        width: 100%;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .login-box,
      .detail-box {
        padding: 28px 18px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <span>Community Hub</span>
      </div>

      <div class="user-label" id="topUser">
        وارد نشده‌اید
      </div>
    </header>

    <!-- صفحه ورود -->
    <section class="screen active" id="loginScreen">
      <div class="login-box">
        <div class="login-logo">👥</div>

        <h1>Community Join</h1>

        <p>
          نام کاربری اکانت روبلاکس خود را وارد نمایید.
        </p>

        <input
          id="usernameInput"
          class="input"
          type="text"
          placeholder="مثلاً: Builderman"
          maxlength="24"
        >

        <div class="error" id="loginError"></div>

        <button class="btn btn-primary" id="continueBtn">
          ورود به بخش کامیونیتی
        </button>
      </div>
    </section>

    <!-- صفحه کامیونیتی‌ها -->
    <section class="screen" id="communitiesScreen">
      <div class="page-title">
        <h1>کامیونیتی‌ها</h1>
        <p>
          کامیونیتی موردنظر خود را جست‌وجو کنید یا کامیونیتی جدید بسازید.
        </p>
      </div>

      <div class="search-area">
        <input
          id="searchInput"
          class="input"
          type="search"
          value="python_community"
          placeholder="جست‌وجوی کامیونیتی..."
        >

        <button class="btn btn-primary" id="searchBtn">
          جست‌وجو
        </button>
      </div>

      <div class="layout">

        <div class="panel">
          <h2>لیست کامیونیتی‌ها</h2>
          <div class="community-list" id="communityList"></div>
        </div>

        <aside class="panel">
          <h2>ساختن Community</h2>

          <form class="create-form" id="createForm">
            <input
              id="newName"
              class="input"
              type="text"
              placeholder="نام کامیونیتی"
              maxlength="30"
              required
            >

            <textarea
              id="newDescription"
              class="input"
              placeholder="توضیحات کامیونیتی"
              maxlength="160"
              required
            ></textarea>

            <button class="btn btn-green" type="submit">
              ساخت کامیونیتی
            </button>
          </form>
        </aside>

      </div>
    </section>

    <!-- صفحه داخل کامیونیتی -->
    <section class="screen" id="detailScreen">

      <button class="btn btn-dark back-btn" id="backBtn">
        ← بازگشت به لیست
      </button>

      <div class="success-banner">
        ✅ ورود انجام شد
      </div>

      <div class="detail-box">
        <div class="detail-avatar" id="detailAvatar">P</div>

        <h1 id="detailName">python_community</h1>

        <p class="detail-description" id="detailDescription"></p>

        <div class="stats">
          <div class="stat">
            <strong id="memberCount">0</strong>
            <span>تعداد ممبر</span>
          </div>

          <div class="stat">
            <strong id="detailRank" class="rank-member">
              member
            </strong>
            <span>رنک شما</span>
          </div>

          <div class="stat">
            <strong id="communityLevel">40</strong>
            <span>لول کامیونیتی</span>
          </div>
        </div>

        <div class="detail-actions">
          <button class="btn btn-red" id="leaveBtn">
            Leave Community
          </button>

          <button class="btn btn-dark" id="detailBackBtn">
            مشاهده کامیونیتی‌ها
          </button>
        </div>
      </div>

    </section>

  </main>

  <script>
    const loginScreen = document.getElementById("loginScreen");
    const communitiesScreen = document.getElementById("communitiesScreen");
    const detailScreen = document.getElementById("detailScreen");

    const usernameInput = document.getElementById("usernameInput");
    const continueBtn = document.getElementById("continueBtn");
    const loginError = document.getElementById("loginError");
    const topUser = document.getElementById("topUser");

    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const communityList = document.getElementById("communityList");

    const createForm = document.getElementById("createForm");
    const newName = document.getElementById("newName");
    const newDescription = document.getElementById("newDescription");

    const detailAvatar = document.getElementById("detailAvatar");
    const detailName = document.getElementById("detailName");
    const detailDescription = document.getElementById("detailDescription");
    const memberCount = document.getElementById("memberCount");
    const detailRank = document.getElementById("detailRank");
    const communityLevel = document.getElementById("communityLevel");

    const leaveBtn = document.getElementById("leaveBtn");
    const backBtn = document.getElementById("backBtn");
    const detailBackBtn = document.getElementById("detailBackBtn");

    let currentUser = localStorage.getItem("community_username") || "";
    let currentCommunityId = null;

    const defaultCommunity = {
      id: "python_community",
      name: "python_community",
      description: "کامیونیتی برنامه‌نویسی پایتون و یادگیری مهارت‌های جدید.",
      members: 128,
      level: 40,
      owner: "CommunityAdmin"
    };

    function getCommunities() {
      let saved = localStorage.getItem("communities");

      if (!saved) {
        const initial = [defaultCommunity];
        localStorage.setItem("communities", JSON.stringify(initial));
        return initial;
      }

      let communities = JSON.parse(saved);

      /*
        اصلاح اطلاعات قدیمی:
        فقط python_community لول ۴۰ دارد.
        بقیه کامیونیتی‌ها لول ۱ دارند.
      */
      communities = communities.map(community => {
        if (community.id === "python_community") {
          return {
            ...community,
            level: 40
          };
        }

        return {
          ...community,
          level: 1
        };
      });

      saveCommunities(communities);
      return communities;
    }

    function saveCommunities(communities) {
      localStorage.setItem(
        "communities",
        JSON.stringify(communities)
      );
    }

    function showScreen(screen) {
      document.querySelectorAll(".screen").forEach(item => {
        item.classList.remove("active");
      });

      screen.classList.add("active");
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function makeId(name) {
      return name
        .toLowerCase()
        .trim()
        .replace(/\s+/g, "_")
        .replace(/[^\w\u0600-\u06FF-]/g, "");
    }

    function firstLetter(name) {
      return name.trim().charAt(0).toUpperCase() || "C";
    }

    function escapeHTML(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderCommunities() {
      const communities = getCommunities();
      const query = searchInput.value.trim().toLowerCase();

      const filtered = communities.filter(community =>
        community.name.toLowerCase().includes(query) ||
        community.description.toLowerCase().includes(query)
      );

      communityList.innerHTML = "";

      if (filtered.length === 0) {
        communityList.innerHTML = `
          <div class="empty">
            کامیونیتی‌ای با این نام پیدا نشد.
          </div>
        `;
        return;
      }

      filtered.forEach(community => {
        const card = document.createElement("div");
        card.className = "community-card";

        card.innerHTML = `
          <div class="community-info">
            <div class="community-avatar">
              ${firstLetter(community.name)}
            </div>

            <div>
              <div class="community-name">
                ${escapeHTML(community.name)}
              </div>

              <div class="community-description">
                ${escapeHTML(community.description)}
              </div>

              <div class="community-meta">
                👥 ${community.members} ممبر
                &nbsp; • &nbsp;
                ⭐ Level ${community.level}
              </div>
            </div>
          </div>

          <button class="btn btn-primary join-btn">
            ورود
          </button>
        `;

        card
          .querySelector(".join-btn")
          .addEventListener("click", () => {
            joinCommunity(community.id);
          });

        communityList.appendChild(card);
      });
    }

    function joinCommunity(id) {
      const communities = getCommunities();
      const community = communities.find(item => item.id === id);

      if (!community) return;

      const joinedKey = `joined_${id}_${currentUser}`;
      const alreadyJoined = localStorage.getItem(joinedKey);

      if (!alreadyJoined) {
        community.members++;
        localStorage.setItem(joinedKey, "true");
        saveCommunities(communities);
      }

      openCommunity(id);
    }

    function openCommunity(id) {
      const communities = getCommunities();
      const community = communities.find(item => item.id === id);

      if (!community) return;

      currentCommunityId = id;

      detailAvatar.textContent = firstLetter(community.name);
      detailName.textContent = community.name;
      detailDescription.textContent = community.description;
      memberCount.textContent = community.members;
      communityLevel.textContent = community.level;

      const isOwner = community.owner === currentUser;

      detailRank.textContent = isOwner ? "owner" : "member";
      detailRank.className = isOwner
        ? "rank-owner"
        : "rank-member";

      showScreen(detailScreen);
    }

    function leaveCommunity() {
      if (!currentCommunityId) return;

      const communities = getCommunities();
      const community = communities.find(
        item => item.id === currentCommunityId
      );

      if (!community) return;

      if (community.owner === currentUser) {
        alert("سازنده نمی‌تواند از کامیونیتی خودش خارج شود.");
        return;
      }

      const joinedKey =
        `joined_${currentCommunityId}_${currentUser}`;

      const alreadyJoined = localStorage.getItem(joinedKey);

      if (alreadyJoined && community.members > 0) {
        community.members--;
        localStorage.removeItem(joinedKey);
        saveCommunities(communities);
      }

      currentCommunityId = null;
      showScreen(communitiesScreen);
      renderCommunities();
    }

    continueBtn.addEventListener("click", () => {
      const username = usernameInput.value.trim();

      if (username.length < 3) {
        loginError.textContent =
          "لطفاً یک User Name معتبر وارد نمایید.";
        return;
      }

      currentUser = username;
      localStorage.setItem("community_username", username);

      topUser.innerHTML =
        `اکانت روبلاکس: <b>${escapeHTML(username)}</b>`;

      loginError.textContent = "";
      showScreen(communitiesScreen);
      renderCommunities();
    });

    usernameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        continueBtn.click();
      }
    });

    searchBtn.addEventListener("click", renderCommunities);
    searchInput.addEventListener("input", renderCommunities);

    createForm.addEventListener("submit", event => {
      event.preventDefault();

      const name = newName.value.trim();
      const description = newDescription.value.trim();

      if (name.length < 3 || description.length < 3) {
        alert("نام و توضیحات را کامل وارد کنید.");
        return;
      }

      const communities = getCommunities();
      const id = makeId(name);

      const exists = communities.some(
        community => community.id === id
      );

      if (exists) {
        alert("این کامیونیتی قبلاً ساخته شده است.");
        return;
      }

      /*
        کامیونیتی جدید از ابتدا لول ۱ دارد.
      */
      const newCommunity = {
        id: id,
        name: name,
        description: description,
        members: 1,
        level: 1,
        owner: currentUser
      };

      communities.push(newCommunity);
      saveCommunities(communities);

      localStorage.setItem(
        `joined_${id}_${currentUser}`,
        "true"
      );

      createForm.reset();

      // ورود مستقیم سازنده به کامیونیتی خودش
      openCommunity(id);
    });

    leaveBtn.addEventListener("click", leaveCommunity);

    backBtn.addEventListener("click", () => {
      showScreen(communitiesScreen);
      renderCommunities();
    });

    detailBackBtn.addEventListener("click", () => {
      showScreen(communitiesScreen);
      renderCommunities();
    });

    if (currentUser) {
      topUser.innerHTML =
        `اکانت روبلاکس: <b>${escapeHTML(currentUser)}</b>`;
    }

    getCommunities();
  </script>

</body>
</html>
