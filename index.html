<!DOCTYPE html>
<html>
<head>
<title>اتصال VPN</title>
<meta charset="UTF-8">
<style>
  body {
    font-family: 'Arial', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f0f2f5;
    flex-direction: column;
  }
  .container {
    background-color: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    text-align: center;
  }
  button {
    background-color: #4CAF50; /* سبز */
    border: none;
    color: white;
    padding: 15px 30px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 18px;
    margin: 15px 2px;
    cursor: pointer;
    border-radius: 8px;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #45a049;
  }
  p {
    color: #555;
    font-size: 16px;
  }
</style>
</head>
<body>

<div class="container">
  <h2>اتصال به VPN</h2>
  <p>برای اتصال، روی دکمه زیر کلیک کنید.</p>
  <p><strong>توجه:</strong> این قابلیت فقط در صورتی کار می‌کند که کلاینت V2Ray یا مشابه آن روی دستگاه شما نصب باشد.</p>

  <button onclick="connectVPN()">اتصال</button>

  <p>اگر برنامه نصب نیست، باید آن را جداگانه دانلود و نصب کنید.</p>
</div>

<script>
function connectVPN() {
  // **مهم:** کانفیگ vmess خود را اینجا جایگزین کنید.
  // این کانفیگ فقط یک مثال است و باید با کانفیگ واقعی خودتان جایگزین شود.
  const vmessConfig = 'vmess://ewogICJ2IjogIjIiLAogICJwcyI6ICJkZS5jb25uZnVsbC5vcmctcmFjZXZwbi1pYTN1bHIiLAogICJhZGQiOiAiZGUuY29ubmZ1bGwub3JnIiwKICAicG9ydCI6IDIwNTMsCiAgImlkIjogIjMwOWNkNjMyLWM3YTMtNDJlMi1iMjk5LTRhYzgyNTc2ZWM2YyIsCiAgInNjeSI6ICJhdXRvIiwKICAibmV0IjogInRjcCIsCiAgInRscyI6ICJ0bHMiLAogICJ0eXBlIjogIm5vbmUiLAogICJmcCI6ICJjaHJvbWUiLAogICJhbHBuIjogImgyLGh0dHAvMS4xLGgzIgp9'; // کانفیگ Vmess شما

  // این لینک تلاش می‌کند برنامه مرتبط با پروتکل vmess را باز کند.
  // برای اندروید، معمولاً برنامه هایی مثل V2rayNG یا Bifrost این پروتکل را پشتیبانی می کنند.
  // برای ویندوز، کلاینت های دسکتاپ V2RayN یا Qv2ray می توانند این کار را انجام دهند.
  const url = vmessConfig;

  // تلاش برای باز کردن URL. این رفتار بسته به مرورگر و سیستم عامل متفاوت است.
  window.location.href = url;

  // یک پیغام برای کاربر نمایش داده می شود تا بداند چه اتفاقی افتاده.
  // اگر برنامه نصب باشد، ممکن است مرورگر به آن برنامه هدایت شود.
  // اگر برنامه نصب نباشد، ممکن است خطا دهد یا کاری نکند.
  // ما نمی توانیم از اینجا تشخیص دهیم که برنامه نصب هست یا نه.
  setTimeout(() => {
    alert('اگر برنامه V2Ray به صورت خودکار باز نشد، لطفاً کانفیگ را به صورت دستی کپی کرده و در برنامه خود وارد کنید.');
  }, 2000); // 2 ثانیه بعد از کلیک، پیغام نمایش داده می شود.
}
</script>

</body>
</html>
