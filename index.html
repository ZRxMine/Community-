<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Infinite Road Game</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #07111f;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    canvas {
      display: block;
    }

    #startScreen,
    #questionBox,
    #deadScreen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(3, 8, 20, .95), rgba(12, 33, 60, .94));
      color: white;
      text-align: center;
    }

    .panel {
      width: min(90%, 430px);
      padding: 30px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 25px;
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(15px);
      box-shadow: 0 0 40px rgba(0, 190, 255, .25);
    }

    h1 {
      margin-top: 0;
      font-size: 38px;
      color: #61e7ff;
      text-shadow: 0 0 15px #00cfff;
    }

    h2 {
      font-size: 27px;
    }

    p {
      line-height: 1.8;
      color: #d6edf5;
    }

    button {
      border: 0;
      border-radius: 15px;
      padding: 15px 24px;
      margin: 7px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #00a8ff, #6c39ff);
      box-shadow: 0 5px 18px rgba(0, 130, 255, .35);
    }

    button:active {
      transform: scale(.94);
    }

    #questionBox,
    #deadScreen {
      display: none;
    }

    #controls {
      position: fixed;
      z-index: 5;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      direction: ltr;
      gap: 10px;
    }

    .control {
      width: 75px;
      height: 58px;
      padding: 0;
      margin: 0;
      font-size: 25px;
      border-radius: 18px;
      background: rgba(0, 0, 0, .55);
      border: 1px solid rgba(255,255,255,.35);
      backdrop-filter: blur(8px);
    }

    #status {
      position: fixed;
      z-index: 5;
      top: 15px;
      left: 15px;
      direction: rtl;
      color: white;
      background: rgba(0,0,0,.45);
      padding: 10px 15px;
      border-radius: 12px;
      font-size: 14px;
    }

    #hint {
      position: fixed;
      z-index: 5;
      top: 15px;
      right: 15px;
      color: #d9f9ff;
      background: rgba(0,0,0,.4);
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 30px;
      }

      .control {
        width: 68px;
        height: 55px;
      }

      .panel {
        padding: 23px;
      }
    }
  </style>
</head>
<body>

  <div id="startScreen">
    <div class="panel">
      <h1>INFINITE ROAD</h1>
      <p>
        وارد مسیر بی‌نهایت شو، جلو برو و آدمک‌های مسیر را پیدا کن.
      </p>
      <button id="startButton">Start game</button>
    </div>
  </div>

  <div id="questionBox">
    <div class="panel">
      <h2>تو بچه‌ای؟</h2>
      <p>یک گزینه را انتخاب کن:</p>
      <button id="kidButton">آره</button>
      <button id="adultButton">من بزرگسالم</button>
    </div>
  </div>

  <div id="deadScreen">
    <div class="panel">
      <h1>DID</h1>
      <p>بازی تمام شد!</p>
      <button onclick="location.reload()">دوباره بازی کن</button>
    </div>
  </div>

  <div id="status">مسافت: 0 متر</div>
  <div id="hint">برای حرکت از دکمه‌های پایین استفاده کن</div>

  <div id="controls">
    <button class="control" id="backButton">◀</button>
    <button class="control" id="forwardButton">▶</button>
    <button class="control" id="jumpButton">⬆</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    let scene, camera, renderer;
    let player;
    let gameStarted = false;
    let gamePaused = true;
    let isJumping = false;
    let jumpVelocity = 0;
    let playerSpeed = 0;
    let distance = 0;
    let npcIndex = 0;
    let npcList = [];
    let floorParts = [];

    const keys = {
      forward: false,
      backward: false,
      left: false,
      right: false
    };

    const startScreen = document.getElementById("startScreen");
    const questionBox = document.getElementById("questionBox");
    const deadScreen = document.getElementById("deadScreen");
    const status = document.getElementById("status");

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x081525);
      scene.fog = new THREE.Fog(0x081525, 20, 150);

      camera = new THREE.PerspectiveCamera(
        65,
        window.innerWidth / window.innerHeight,
        0.1,
        500
      );

      camera.position.set(0, 4.5, -9);

      renderer = new THREE.WebGLRenderer({
        antialias: true
      });

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      addLights();
      createWorld();
      player = createCharacter(0x35d9ff, 0xffd0aa);
      player.position.set(0, 0, 2);
      scene.add(player);

      createNPC(0, 34);
      createNPC(1, 78);
      createNPC(2, 125);

      setupControls();

      window.addEventListener("resize", onResize);
    }

    function addLights() {
      const ambient = new THREE.HemisphereLight(
        0x9bdcff,
        0x172238,
        2.2
      );
      scene.add(ambient);

      const moonLight = new THREE.DirectionalLight(0xffffff, 2.5);
      moonLight.position.set(15, 30, -20);
      moonLight.castShadow = true;
      scene.add(moonLight);

      const blueLight = new THREE.PointLight(0x00aaff, 15, 60);
      blueLight.position.set(0, 8, 15);
      scene.add(blueLight);
    }

    function createWorld() {
      const roadMaterial = new THREE.MeshStandardMaterial({
        color: 0x202b3b,
        roughness: .85
      });

      const lineMaterial = new THREE.MeshBasicMaterial({
        color: 0x8beeff,
        emissive: 0x00aaff
      });

      const wallMaterial = new THREE.MeshStandardMaterial({
        color: 0x182943,
        metalness: .2,
        roughness: .7
      });

      const segmentLength = 25;

      for (let i = 0; i < 12; i++) {
        const group = new THREE.Group();

        const road = new THREE.Mesh(
          new THREE.BoxGeometry(18, .3, segmentLength),
          roadMaterial
        );
        road.position.y = -0.25;
        road.receiveShadow = true;
        group.add(road);

        const leftWall = new THREE.Mesh(
          new THREE.BoxGeometry(.5, 5, segmentLength),
          wallMaterial
        );
        leftWall.position.set(-9.3, 2.2, 0);
        leftWall.castShadow = true;
        group.add(leftWall);

        const rightWall = leftWall.clone();
        rightWall.position.x = 9.3;
        group.add(rightWall);

        for (let z = -10; z <= 10; z += 5) {
          const line = new THREE.Mesh(
            new THREE.BoxGeometry(.16, .03, 2),
            lineMaterial
          );
          line.position.set(0, -.07, z);
          group.add(line);
        }

        group.position.z = i * segmentLength;
        floorParts.push(group);
        scene.add(group);
      }
    }

    function createCharacter(bodyColor, skinColor) {
      const character = new THREE.Group();

      const bodyMaterial = new THREE.MeshStandardMaterial({
        color: bodyColor,
        roughness: .45,
        metalness: .15
      });

      const skinMaterial = new THREE.MeshStandardMaterial({
        color: skinColor,
        roughness: .7
      });

      const shoeMaterial = new THREE.MeshStandardMaterial({
        color: 0x111827,
        roughness: .5
      });

      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(.42, 1.15, 6, 12),
        bodyMaterial
      );
      body.position.y = 1.45;
      body.castShadow = true;
      character.add(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(.42, 20, 16),
        skinMaterial
      );
      head.position.y = 2.65;
      head.castShadow = true;
      character.add(head);

      const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x111111 });

      const eye1 = new THREE.Mesh(
        new THREE.SphereGeometry(.045, 8, 8),
        eyeMaterial
      );
      eye1.position.set(-.15, 2.72, -.37);
      character.add(eye1);

      const eye2 = eye1.clone();
      eye2.position.x = .15;
      character.add(eye2);

      const armGeometry = new THREE.CapsuleGeometry(.11, .72, 5, 8);
      const legGeometry = new THREE.CapsuleGeometry(.14, .85, 5, 8);
      const shoeGeometry = new THREE.BoxGeometry(.33, .2, .58);

      const leftArm = new THREE.Mesh(armGeometry, bodyMaterial);
      leftArm.position.set(-.55, 1.45, 0);
      leftArm.rotation.z = -.15;
      leftArm.castShadow = true;
      character.add(leftArm);

      const rightArm = leftArm.clone();
      rightArm.position.x = .55;
      rightArm.rotation.z = .15;
      character.add(rightArm);

      const leftLeg = new THREE.Mesh(legGeometry, bodyMaterial);
      leftLeg.position.set(-.22, .45, 0);
      leftLeg.castShadow = true;
      character.add(leftLeg);

      const rightLeg = leftLeg.clone();
      rightLeg.position.x = .22;
      character.add(rightLeg);

      const leftShoe = new THREE.Mesh(shoeGeometry, shoeMaterial);
      leftShoe.position.set(-.22, .02, -.15);
      leftShoe.castShadow = true;
      character.add(leftShoe);

      const rightShoe = leftShoe.clone();
      rightShoe.position.x = .22;
      character.add(rightShoe);

      character.userData = {
        leftArm,
        rightArm,
        leftLeg,
        rightLeg,
        baseY: 0,
        isNPC: false
      };

      return character;
    }

    function createNPC(index, zPosition) {
      const npc = createCharacter(
        [0xff4d6d, 0xffb703, 0x9b5de5][index % 3],
        0xffc7a8
      );

      npc.position.set(0, 0, zPosition);
      npc.rotation.y = Math.PI;
      npc.userData.isNPC = true;
      npc.userData.id = npcIndex++;

      npcList.push(npc);
      scene.add(npc);
    }

    function setupControls() {
      document.getElementById("startButton").addEventListener("click", () => {
        startScreen.style.display = "none";
        gameStarted = true;
        gamePaused = false;

        // تلپورت بازیکن به جلو
        player.position.z = 12;
        distance = 10;
        status.textContent = "مسافت: 10 متر";
      });

      document.getElementById("kidButton").addEventListener("click", () => {
        questionBox.style.display = "none";
        gamePaused = true;
        deadScreen.style.display = "flex";
      });

      document.getElementById("adultButton").addEventListener("click", () => {
        questionBox.style.display = "none";
        gamePaused = false;

        // آدمک قبلی حذف شود
        if (npcList.length > 0) {
          const npc = npcList.shift();
          scene.remove(npc);
        }

        // آدمک جدید جلوتر ظاهر شود
        const lastNPC = npcList[npcList.length - 1];
        const nextZ = lastNPC
          ? lastNPC.position.z + 48
          : player.position.z + 50;

        createNPC(npcIndex, nextZ);
      });

      holdButton("forwardButton", "forward");
      holdButton("backButton", "backward");

      document.getElementById("jumpButton").addEventListener("pointerdown", jump);

      window.addEventListener("keydown", (event) => {
        if (event.code === "ArrowUp" || event.code === "KeyW") {
          keys.forward = true;
        }

        if (event.code === "ArrowDown" || event.code === "KeyS") {
          keys.backward = true;
        }

        if (event.code === "ArrowLeft" || event.code === "KeyA") {
          keys.left = true;
        }

        if (event.code === "ArrowRight" || event.code === "KeyD") {
          keys.right = true;
        }

        if (event.code === "Space") {
          jump();
        }
      });

      window.addEventListener("keyup", (event) => {
        if (event.code === "ArrowUp" || event.code === "KeyW") {
          keys.forward = false;
        }

        if (event.code === "ArrowDown" || event.code === "KeyS") {
          keys.backward = false;
        }

        if (event.code === "ArrowLeft" || event.code === "KeyA") {
          keys.left = false;
        }

        if (event.code === "ArrowRight" || event.code === "KeyD") {
          keys.right = false;
        }
      });
    }

    function holdButton(id, keyName) {
      const button = document.getElementById(id);

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        keys[keyName] = true;
      });

      button.addEventListener("pointerup", () => {
        keys[keyName] = false;
      });

      button.addEventListener("pointerleave", () => {
        keys[keyName] = false;
      });

      button.addEventListener("pointercancel", () => {
        keys[keyName] = false;
      });
    }

    function jump() {
      if (!gameStarted || gamePaused || isJumping) return;

      isJumping = true;
      jumpVelocity = .22;
    }

    function updatePlayer() {
      if (!gameStarted || gamePaused) return;

      if (keys.forward) {
        playerSpeed += .012;
      } else if (keys.backward) {
        playerSpeed -= .014;
      } else {
        playerSpeed *= .88;
      }

      playerSpeed = THREE.MathUtils.clamp(playerSpeed, -.18, .34);

      player.position.z += playerSpeed;

      if (keys.left) {
        player.position.x -= .16;
      }

      if (keys.right) {
        player.position.x += .16;
      }

      player.position.x = THREE.MathUtils.clamp(player.position.x, -7.5, 7.5);

      if (isJumping) {
        player.position.y += jumpVelocity;
        jumpVelocity -= .012;

        if (player.position.y <= 0) {
          player.position.y = 0;
          isJumping = false;
          jumpVelocity = 0;
        }
      }

      const walking = Math.abs(playerSpeed) > .025;
      animateCharacter(player, walking);

      distance = Math.max(0, Math.floor(player.position.z - 2));
      status.textContent = "مسافت: " + distance + " متر";

      checkNPCContact();
    }

    function animateCharacter(character, walking) {
      const parts = character.userData;
      if (!parts) return;

      const time = performance.now() * .012;
      const movement = walking ? Math.sin(time) * .55 : 0;

      parts.leftArm.rotation.x = movement;
      parts.rightArm.rotation.x = -movement;
      parts.leftLeg.rotation.x = -movement;
      parts.rightLeg.rotation.x = movement;
    }

    function checkNPCContact() {
      for (const npc of npcList) {
        if (npc.userData.used) continue;

        const distanceZ = Math.abs(player.position.z - npc.position.z);
        const distanceX = Math.abs(player.position.x - npc.position.x);

        if (distanceZ < 2.4 && distanceX < 2.2) {
          npc.userData.used = true;
          gamePaused = true;
          questionBox.style.display = "flex";
          break;
        }
      }
    }

    function updateInfiniteWorld() {
      for (const part of floorParts) {
        if (part.position.z + 25 < player.position.z - 30) {
          part.position.z += floorParts.length * 25;
        }
      }
    }

    function updateCamera() {
      const targetCameraPosition = new THREE.Vector3(
        player.position.x * .35,
        player.position.y + 4.4,
        player.position.z - 8
      );

      camera.position.lerp(targetCameraPosition, .08);

      const lookTarget = new THREE.Vector3(
        player.position.x,
        player.position.y + 1.4,
        player.position.z + 7
      );

      camera.lookAt(lookTarget);
    }

    function animate() {
      requestAnimationFrame(animate);

      updatePlayer();
      updateInfiniteWorld();
      updateCamera();

      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
