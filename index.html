<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سکه عضو بگیر</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle {
            position: absolute; border-radius: 50%; background: rgba(255,255,255,0.3);
            animation: float 6s infinite;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-30px) scale(1.2); opacity: 0.8; }
            100% { transform: translateY(0) scale(1); opacity: 0.3; }
        }
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 25px; padding: 35px; width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5); position: relative; z-index: 1;
            animation: cardIn 0.6s ease;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .logo {
            text-align: center;
            margin-bottom: 10px;
            animation: spinCoin 3s infinite;
        }
        .logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
        }
        @keyframes spinCoin {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(180deg); }
            100% { transform: rotateY(360deg); }
        }
        h1 {
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 26px; margin-bottom: 5px;
        }
        .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 25px; }
        .step { display: none; animation: fadeIn 0.5s ease; }
        .step.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; font-weight: bold; }
        .input-wrap { position: relative; margin-bottom: 15px; }
        .input-wrap .icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 18px; }
        input {
            width: 100%; padding: 14px 40px; border: 2px solid #e0e0e0; border-radius: 12px;
            font-size: 16px; transition: all 0.3s; background: #fafafa;
        }
        input:focus {
            outline: none; border-color: #667eea; background: white;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
        }
        .btn {
            width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102,126,234,0.4); }
        .btn:active { transform: translateY(0); }
        .btn .shine {
            position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shine 3s infinite;
        }
        @keyframes shine {
            0% { left: -100%; }
            50% { left: 200%; }
            100% { left: 200%; }
        }
        .code-box {
            background: linear-gradient(135deg, #f0f4ff, #e8ecff);
            border: 2px dashed #667eea; border-radius: 12px; padding: 15px;
            text-align: center; margin-bottom: 15px; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(102,126,234,0.4); }
            50% { box-shadow: 0 0 0 10px rgba(102,126,234,0); }
        }
        .code-box p { color: #888; font-size: 13px; margin-bottom: 5px; }
        .code-box .code { font-size: 32px; font-weight: bold; color: #667eea; letter-spacing: 10px; }
        .msg {
            padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 13px;
            text-align: center; display: none; animation: shake 0.5s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .msg.error { background: #fdecea; color: #e74c3c; border: 1px solid #f5c6cb; }
        .msg.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .back {
            background: none; border: none; color: #667eea; cursor: pointer;
            font-size: 13px; margin-top: 15px; width: 100%; text-align: center;
        }
        .back:hover { text-decoration: underline; }
        .success-check { text-align: center; font-size: 70px; animation: popIn 0.6s ease; }
        @keyframes popIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .member-box {
            background: linear-gradient(135deg, #f0f4ff, #e8ecff);
            border-radius: 15px; padding: 20px; margin-top: 15px; text-align: center;
        }
        .member-box h2 { color: #667eea; margin-bottom: 10px; }
        .member-box p { color: #555; margin: 5px 0; }
        .coins {
            background: linear-gradient(135deg, #fff3cd, #ffeeba);
            border-radius: 12px; padding: 15px; margin-top: 15px;
            text-align: center; color: #856404; font-size: 18px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="card">
        <div class="logo">
            <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj48Y2lyY2xlIGN4PSI0MCIgY3k9IjQwIiByPSIzNiIgZmlsbD0iI2ZmZGMwMCIgc3Ryb2tlPSIjZGI5MDAwIiBzdHJva2Utd2lkdGg9IjMiLz48Y2lyY2xlIGN4PSI0MCIgY3k9IjQwIiByPSIyNiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZGI5MDAwIiBzdHJva2Utd2lkdGg9IjIiLz48dGV4dCB4PSI0MCIgeT0iNDciIGZvbnQtc2l6ZT0iMjAiIGZvbnQtd2VpZ2h0PSJib2xkIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjZGI5MDAwIj7CoDwvdGV4dD48L3N2Zz4=" alt="سکه">
        </div>
        <h1>سکه عضو بگیر</h1>
        <p class="subtitle">سیستم امن ورود با کد تأیید</p>

        <!-- مرحله ۱: شماره -->
        <div class="step active" id="s1">
            <label>📱 شماره موبایل</label>
            <div class="input-wrap">
                <span class="icon">📞</span>
                <input type="tel" id="phone" placeholder="09xxxxxxxxx" maxlength="11">
            </div>
            <div class="msg error" id="phoneErr">شماره معتبر نیست! (مثال: 09123456789)</div>
            <button class="btn" onclick="sendCode()"><span class="shine"></span>ورود</button>
        </div>

        <!-- مرحله ۲: کد تأیید -->
        <div class="step" id="s2">
            <label>🔐 کد تأیید</label>
            <div class="code-box">
                <p>📩 کد تأیید (شبیهساز):</p>
                <div class="code" id="showCode">----</div>
            </div>
            <div class="input-wrap">
                <span class="icon">🔑</span>
                <input type="text" id="code" placeholder="کد ۴ رقمی" maxlength="4">
            </div>
            <div class="msg error" id="codeErr"></div>
            <button class="btn" onclick="verifyCode()"><span class="shine"></span>تأیید کد</button>
            <button class="back" onclick="goBack(1)">← تغییر شماره</button>
        </div>

        <!-- مرحله ۳: عضو شدی -->
        <div class="step" id="s3">
            <div class="success-check">✅</div>
            <h1 style="text-align:center; margin-bottom:10px;">عضو شدی!</h1>
            <div class="member-box">
                <h2>🎉 خوش اومدی</h2>
                <p>شماره: <span id="showPhone"></span></p>
                <p>به جمع ما پیوستی 👋</p>
            </div>
            <div class="coins">🪙 ۵۰ سکه هدیه گرفتی!</div>
            <button class="btn" onclick="resetAll()" style="margin-top:15px;"><span class="shine"></span>خروج</button>
        </div>
    </div>

    <script>
        let myCode = '';
        let currentPhone = '';

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 8 + 3;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 6 + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        function sendCode() {
            const phone = document.getElementById('phone').value;
            const err = document.getElementById('phoneErr');
            if (!/^09\d{9}$/.test(phone)) { err.style.display = 'block'; return; }
            err.style.display = 'none';
            currentPhone = phone;
            myCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('showCode').textContent = myCode;
            showStep(2);
        }

        function verifyCode() {
            const input = document.getElementById('code').value;
            const err = document.getElementById('codeErr');
            if (input === myCode) {
                err.style.display = 'none';
                document.getElementById('showPhone').textContent = currentPhone;
                showStep(3);
            } else {
                err.textContent = 'کد اشتباهه!';
                err.style.display = 'block';
            }
        }

        function showStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('s' + n).classList.add('active');
        }

        function goBack(n) {
            showStep(n);
            document.getElementById('code').value = '';
            document.getElementById('codeErr').style.display = 'none';
        }

        function resetAll() {
            showStep(1);
            document.getElementById('phone').value = '';
            document.getElementById('code').value = '';
            document.getElementById('showPhone').textContent = '';
            currentPhone = '';
        }
    </script>
</body>
</html>
