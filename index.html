<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سکه عضو بگیر</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #667eea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
        }
        h1 { color: #333; font-size: 22px; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        .hidden { display: none; }
        .code-box {
            background: #f0f4ff;
            border: 2px dashed #667eea;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            letter-spacing: 6px;
        }
        .err { color: red; font-size: 13px; }
        .member-box {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .member-box h2 { color: #667eea; margin: 0 0 10px 0; }
        .member-box p { color: #555; margin: 5px 0; }
        .coins {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            color: #856404;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🪙 سکه عضو بگیر</h1>

        <!-- مرحله ۱: شماره -->
        <div id="s1">
            <input type="tel" id="phone" placeholder="09xxxxxxxxx" maxlength="11">
            <button onclick="sendCode()">ادامه</button>
        </div>

        <!-- مرحله ۲: کد -->
        <div id="s2" class="hidden">
            <p>یه کد برات فرستادیم، وارد کن:</p>
            <div class="code-box" id="showCode">----</div>
            <input type="text" id="code" placeholder="کد ۴ رقمی" maxlength="4">
            <div class="err" id="err"></div>
            <button onclick="verify()">تأیید کد</button>
        </div>

        <!-- مرحله ۳: عضو بگیر -->
        <div id="s3" class="hidden">
            <div class="member-box">
                <h2>🎉 عضو شدی!</h2>
                <p>شماره: <span id="showPhone"></span></p>
                <p>خوش اومدی به جمع ما 👋</p>
            </div>
            <div class="coins">🪙 ۵۰ سکه هدیه گرفتی!</div>
            <button onclick="reset()">برگشت به اول</button>
        </div>
    </div>

    <script>
        let myCode = '';

        function sendCode() {
            let p = document.getElementById('phone').value;
            if (!/^09\d{9}$/.test(p)) {
                alert('شماره معتبر نیست!');
                return;
            }
            // ساخت کد رندوم ۴ رقمی
            myCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('showCode').textContent = myCode;
            document.getElementById('s1').classList.add('hidden');
            document.getElementById('s2').classList.remove('hidden');
        }

        function verify() {
            let c = document.getElementById('code').value;
            if (c === myCode) {
                document.getElementById('showPhone').textContent = document.getElementById('phone').value;
                document.getElementById('s2').classList.add('hidden');
                document.getElementById('s3').classList.remove('hidden');
            } else {
                document.getElementById('err').textContent = 'کد اشتباهه! دوباره تلاش کن';
            }
        }

        function reset() {
            document.getElementById('s3').classList.add('hidden');
            document.getElementById('s1').classList.remove('hidden');
            document.getElementById('phone').value = '';
            document.getElementById('code').value = '';
            document.getElementById('err').textContent = '';
        }
    </script>
</body>
</html>
