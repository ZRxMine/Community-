<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community</title>

  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #718096;
      --border: #e5e7eb;
      --danger: #ef4444;
      --green: #16a34a;
    }

    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* Login */
    #authPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      padding: 20px;
    }

    .auth-box {
      width: 390px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 50px #0004;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px;
      outline: none;
      font-size: 14px;
      background: white;
    }

    input:focus,
    textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .primary-btn {
      width: 100%;
      padding: 13px;
      color: white;
      background: var(--primary);
      border-radius: 10px;
      font-size: 15px;
    }

    .primary-btn:hover {
      background: var(--primary-dark);
    }

    .gray-btn {
      padding: 10px 15px;
      color: #374151;
      background: #eef0f5;
      border-radius: 9px;
    }

    .danger-btn {
      padding: 10px 15px;
      color: white;
      background: var(--danger);
      border-radius: 9px;
    }

    #authMessage {
      min-height: 22px;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    /* App */
    #appPage {
      min-height: 100vh;
    }

    .navbar {
      height: 65px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-logo {
      color: var(--primary);
      font-size: 22px;
      font-weight: bold;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-name {
      color: var(--muted);
      font-size: 14px;
    }

    .layout {
      max-width: 1250px;
      margin: 25px auto;
      padding: 0 18px;
      display: grid;
      grid-template-columns: 250px minmax(400px, 650px) 280px;
      gap: 22px;
      align-items: start;
    }

    .sidebar,
    .rightbar,
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .sidebar {
      padding: 15px;
      position: sticky;
      top: 90px;
    }

    .sidebar h3,
    .rightbar h3 {
      margin: 5px 0 15px;
      font-size: 16px;
    }

    .community-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 7px;
      border-radius: 9px;
      cursor: pointer;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .community-item:hover,
    .community-item.active {
      background: #eef2ff;
      color: var(--primary-dark);
    }

    .community-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      background: linear-gradient(135deg, #6366f1, #a855f7);
    }

    .create-community {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border-radius: 9px;
      color: var(--primary-dark);
      background: #eef2ff;
    }

    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .feed-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .post-box {
      padding: 18px;
      margin-bottom: 16px;
    }

    .post-box textarea {
      margin-bottom: 10px;
    }

    .post-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .post-community-select {
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }

    .post {
      padding: 18px;
      margin-bottom: 15px;
    }

    .post-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .avatar {
      width: 39px;
      height: 39px;
      border-radius: 50%;
      color: white;
      background: var(--primary);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .post-user {
      font-weight: bold;
      font-size: 14px;
    }

    .post-time {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .post-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .post-content {
      color: #4b5563;
      line-height: 1.9;
      white-space: pre-wrap;
    }

    .post-community {
      display: inline-block;
      color: var(--primary-dark);
      background: #eef2ff;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .post-bottom {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .post-bottom button {
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 7px;
    }

    .post-bottom button:hover {
      background: #f1f5f9;
    }

    .rightbar {
      padding: 17px;
      position: sticky;
      top: 90px;
    }

    .suggestion {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
    }

    .suggestion:last-child {
      border-bottom: 0;
    }

    .suggestion-info {
      flex: 1;
    }

    .suggestion-name {
      font-size: 13px;
      font-weight: bold;
    }

    .suggestion-members {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .join-btn {
      color: var(--primary);
      background: #eef2ff;
      border-radius: 7px;
      padding: 7px;
      font-size: 12px;
    }

    .empty {
      padding: 40px 15px;
      text-align: center;
      color: var(--muted);
    }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0007;
      padding: 20px;
    }

    .modal {
      width: 420px;
      max-width: 100%;
      background: white;
      border-radius: 16px;
      padding: 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .close-btn {
      background: transparent;
      font-size: 23px;
      color: #6b7280;
    }

    @media (max-width: 950px) {
      .layout {
        grid-template-columns: 210px minmax(300px, 1fr);
      }

      .rightbar {
        display: none;
      }
    }

    @media (max-width: 650px) {
      .navbar {
        padding: 0 15px;
      }

      .user-name {
        display: none;
      }

      .layout {
        display: block;
        margin-top: 15px;
      }

      .sidebar {
        position: static;
        margin-bottom: 15px;
      }

      .sidebar-list {
        display: flex;
        overflow-x: auto;
        gap: 5px;
      }

      .community-item {
        white-space: nowrap;
      }

      .create-community {
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- صفحه ورود -->
  <section id="authPage">
    <div class="auth-box">
      <div class="logo">Community</div>
      <div class="auth-subtitle">به کامیونیتی خودت خوش آمدی</div>

      <div class="input-group">
        <label for="username">نام کاربری</label>
        <input id="username" type="text" placeholder="مثلاً ali_123">
      </div>

      <div class="input-group">
        <label for="password">رمز عبور</label>
        <input id="password" type="password" placeholder="حداقل ۸ کاراکتر">
      </div>

      <button class="primary-btn" onclick="loginOrRegister()">
        ورود / ساخت حساب
      </button>

      <div id="authMessage"></div>
    </div>
  </section>

  <!-- برنامه اصلی -->
  <section id="appPage" class="hidden">

    <nav class="navbar">
      <div class="nav-logo">Community</div>

      <div class="nav-left">
        <span class="user-name">
          سلام، <b id="navUsername"></b>
        </span>
        <button class="danger-btn" onclick="logout()">خروج</button>
      </div>
    </nav>

    <main class="layout">

      <!-- لیست کامیونیتی‌ها -->
      <aside class="sidebar">
        <h3>کامیونیتی‌ها</h3>

        <div id="communityList" class="sidebar-list"></div>

        <button class="create-community" onclick="openCommunityModal()">
          + ساخت کامیونیتی
        </button>
      </aside>

      <!-- فید -->
      <section>
        <div class="feed-header">
          <h2 id="feedTitle">همه پست‌ها</h2>
          <button class="gray-btn" onclick="showAllPosts()">همه</button>
        </div>

        <div class="card post-box">
          <textarea id="postText" placeholder="چی تو ذهنت می‌گذره؟"></textarea>

          <div class="post-actions">
            <select id="postCommunity" class="post-community-select"></select>

            <button class="primary-btn" style="width:auto;padding:10px 18px"
                    onclick="createPost()">
              انتشار پست
            </button>
          </div>
        </div>

        <div id="postsList"></div>
      </section>

      <!-- کامیونیتی‌های محبوب -->
      <aside class="rightbar">
        <h3>کامیونیتی‌های محبوب</h3>
        <div id="popularCommunities"></div>
      </aside>

    </main>
  </section>

  <!-- پنجره ساخت کامیونیتی -->
  <div id="communityModal" class="modal-bg hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>ساخت کامیونیتی جدید</h2>
        <button class="close-btn" onclick="closeCommunityModal()">×</button>
      </div>

      <div class="input-group">
        <label for="communityName">نام کامیونیتی</label>
        <input id="communityName" type="text" placeholder="مثلاً برنامه‌نویسی">
      </div>

      <div class="input-group">
        <label for="communityDescription">توضیحات</label>
        <textarea id="communityDescription"
                  placeholder="کامیونیتی درباره چیست؟"></textarea>
      </div>

      <button class="primary-btn" onclick="createCommunity()">
        ساخت کامیونیتی
      </button>

      <div id="communityMessage"></div>
    </div>
  </div>

  <script>
    const defaultCommunities = [
      {
        id: "general",
        name: "عمومی",
        description: "گفت‌وگوی آزاد درباره هر موضوعی",
        members: 1240
      },
      {
        id: "technology",
        name: "تکنولوژی",
        description: "اخبار و بحث‌های دنیای فناوری",
        members: 890
      },
      {
        id: "programming",
        name: "برنامه‌نویسی",
        description: "یادگیری و گفت‌وگو درباره کدنویسی",
        members: 760
      },
      {
        id: "gaming",
        name: "گیمینگ",
        description: "بازی‌ها، اخبار و نقد و بررسی",
        members: 540
      },
      {
        id: "music",
        name: "موسیقی",
        description: "آهنگ‌ها و هنرمندان مورد علاقه",
        members: 430
      }
    ];

    const defaultPosts = [
      {
        id: 1,
        username: "admin",
        communityId: "general",
        text: "به کامیونیتی خوش آمدید! اینجا می‌توانید با بقیه گفتگو کنید و پست بگذارید.",
        likes: 12,
        comments: 3,
        time: "امروز"
      },
      {
        id: 2,
        username: "sara",
        communityId: "programming",
        text: "بهترین زبان برنامه‌نویسی برای شروع چیست؟ تجربه‌تان را با بقیه به اشتراک بگذارید.",
        likes: 24,
        comments: 8,
        time: "۲ ساعت پیش"
      },
      {
        id: 3,
        username: "mohammad",
        communityId: "gaming",
        text: "این روزها چه بازی‌ای انجام می‌دهید؟",
        likes: 9,
        comments: 5,
        time: "۵ ساعت پیش"
      }
    ];

    let currentUser = "";
    let selectedCommunity = "all";

    function getUsers() {
      return JSON.parse(localStorage.getItem("communityUsers") || "{}");
    }

    function saveUsers(users) {
      localStorage.setItem("communityUsers", JSON.stringify(users));
    }

    function getCommunities() {
      const saved = localStorage.getItem("communities");

      if (!saved) {
        localStorage.setItem(
          "communities",
          JSON.stringify(defaultCommunities)
        );
        return defaultCommunities;
      }

      return JSON.parse(saved);
    }

    function saveCommunities(communities) {
      localStorage.setItem(
        "communities",
        JSON.stringify(communities)
      );
    }

    function getPosts() {
      const saved = localStorage.getItem("communityPosts");

      if (!saved) {
        localStorage.setItem(
          "communityPosts",
          JSON.stringify(defaultPosts)
        );
        return defaultPosts;
      }

      return JSON.parse(saved);
    }

    function savePosts(posts) {
      localStorage.setItem(
        "communityPosts",
        JSON.stringify(posts)
      );
    }

    function showAuthMessage(text, color = "crimson") {
      const message = document.getElementById("authMessage");
      message.textContent = text;
      message.style.color = color;
    }

    function loginOrRegister() {
      const username = document.getElementById("username")
        .value.trim();

      const password = document.getElementById("password")
        .value;

      if (username.length < 3) {
        showAuthMessage("نام کاربری باید حداقل ۳ کاراکتر باشد.");
        return;
      }

      if (password.length < 8) {
        showAuthMessage("رمز عبور باید حداقل ۸ کاراکتر باشد.");
        return;
      }

      const users = getUsers();

      if (!users[username]) {
        users[username] = password;
        saveUsers(users);
        showAuthMessage("حساب ساخته شد.", "green");
      } else if (users[username] !== password) {
        showAuthMessage("رمز عبور اشتباه است.");
        return;
      }

      currentUser = username;
      localStorage.setItem("currentUser", username);

      openApp();
    }

    function openApp() {
      document.getElementById("authPage").classList.add("hidden");
      document.getElementById("appPage").classList.remove("hidden");
      document.getElementById("navUsername").textContent = currentUser;

      renderCommunities();
      renderPostSelect();
      renderPopularCommunities();
      renderPosts();
    }

    function logout() {
      localStorage.removeItem("currentUser");
      currentUser = "";

      document.getElementById("appPage").classList.add("hidden");
      document.getElementById("authPage").classList.remove("hidden");

      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    }

    function getCommunityById(id) {
      return getCommunities().find(community => community.id === id);
    }

    function getCommunityIcon(name) {
      return name.charAt(0).toUpperCase();
    }

    function renderCommunities() {
      const list = document.getElementById("communityList");
      const communities = getCommunities();

      list.innerHTML = `
        <div class="community-item ${selectedCommunity === "all" ? "active" : ""}"
             onclick="showAllPosts()">
          <div class="community-icon">★</div>
          <span>همه پست‌ها</span>
        </div>
      `;

      communities.forEach(community => {
        list.innerHTML += `
          <div class="community-item ${
            selectedCommunity === community.id ? "active" : ""
          }"
          onclick="filterCommunity('${community.id}')">

            <div class="community-icon">
              ${getCommunityIcon(community.name)}
            </div>

            <span>${escapeHTML(community.name)}</span>
          </div>
        `;
      });
    }

    function renderPostSelect() {
      const select = document.getElementById("postCommunity");
      const communities = getCommunities();

      select.innerHTML = communities.map(community => `
        <option value="${community.id}">
          ${escapeHTML(community.name)}
        </option>
      `).join("");

      if (selectedCommunity !== "all") {
        select.value = selectedCommunity;
      }
    }

    function renderPopularCommunities() {
      const box = document.getElementById("popularCommunities");
      const communities = getCommunities()
        .sort((a, b) => b.members - a.members)
        .slice(0, 5);

      box.innerHTML = communities.map(community => `
        <div class="suggestion">
          <div class="community-icon">
            ${getCommunityIcon(community.name)}
          </div>

          <div class="suggestion-info">
            <div class="suggestion-name">
              ${escapeHTML(community.name)}
            </div>

            <div class="suggestion-members">
              ${community.members} عضو
            </div>
          </div>

          <button class="join-btn"
                  onclick="joinCommunity('${community.id}')">
            عضویت
          </button>
        </div>
      `).join("");
    }

    function renderPosts() {
      const postsBox = document.getElementById("postsList");
      let posts = getPosts();

      if (selectedCommunity !== "all") {
        posts = posts.filter(
          post => post.communityId === selectedCommunity
        );
      }

      if (posts.length === 0) {
        postsBox.innerHTML = `
          <div class="card empty">
            هنوز پستی در این کامیونیتی وجود ندارد.
          </div>
        `;
        return;
      }

      postsBox.innerHTML = posts.map(post => {
        const community = getCommunityById(post.communityId);

        return `
          <article class="card post">
            <div class="post-top">
              <div class="avatar">
                ${post.username.charAt(0).toUpperCase()}
              </div>

              <div>
                <div class="post-user">
                  ${escapeHTML(post.username)}
                </div>

                <span class="post-time">
                  ${post.time}
                </span>
              </div>
            </div>

            <div class="post-community">
              #${community ? escapeHTML(community.name) : "عمومی"}
            </div>

            <div class="post-content">
              ${escapeHTML(post.text)}
            </div>

            <div class="post-bottom">
              <button onclick="likePost(${post.id})">
                ♥ ${post.likes || 0}
              </button>

              <button onclick="commentPost()">
                💬 ${post.comments || 0}
              </button>

              ${
                post.username === currentUser
                  ? `<button onclick="deletePost(${post.id})">حذف</button>`
                  : ""
              }
            </div>
          </article>
        `;
      }).join("");
    }

    function createPost() {
      const text = document.getElementById("postText")
        .value.trim();

      const communityId = document.getElementById("postCommunity")
        .value;

      if (!text) {
        alert("متن پست را بنویس.");
        return;
      }

      const posts = getPosts();

      posts.unshift({
        id: Date.now(),
        username: currentUser,
        communityId: communityId,
        text: text,
        likes: 0,
        comments: 0,
        time: "همین الان"
      });

      savePosts(posts);

      document.getElementById("postText").value = "";

      selectedCommunity = communityId;
      document.getElementById("feedTitle").textContent =
        "#" + getCommunityById(communityId).name;

      renderCommunities();
      renderPosts();
    }

    function likePost(id) {
      const posts = getPosts();
      const post = posts.find(post => post.id === id);

      if (post) {
        post.likes = (post.likes || 0) + 1;
        savePosts(posts);
        renderPosts();
      }
    }

    function commentPost() {
      alert("بخش کامنت در نسخه بعدی قابل اضافه کردن است.");
    }

    function deletePost(id) {
      const confirmed = confirm("این پست حذف شود؟");

      if (!confirmed) return;

      const posts = getPosts()
        .filter(post => post.id !== id);

      savePosts(posts);
      renderPosts();
    }

    function filterCommunity(id) {
      selectedCommunity = id;

      const community = getCommunityById(id);

      document.getElementById("feedTitle").textContent =
        "#" + community.name;

      renderCommunities();
      renderPosts();
    }

    function showAllPosts() {
      selectedCommunity = "all";
      document.getElementById("feedTitle").textContent =
        "همه پست‌ها";

      renderCommunities();
      renderPosts();
    }

    function joinCommunity(id) {
      const communities = getCommunities();
      const community = communities.find(item => item.id === id);

      if (community) {
        community.members++;
        saveCommunities(communities);
        renderPopularCommunities();
        alert("با موفقیت عضو کامیونیتی شدی.");
      }
    }

    function openCommunityModal() {
      document
        .getElementById("communityModal")
        .classList.remove("hidden");
    }

    function closeCommunityModal() {
      document
        .getElementById("communityModal")
        .classList.add("hidden");

      document.getElementById("communityName").value = "";
      document.getElementById("communityDescription").value = "";
      document.getElementById("communityMessage").textContent = "";
    }

    function createCommunity() {
      const name = document.getElementById("communityName")
        .value.trim();

      const description = document
        .getElementById("communityDescription")
        .value.trim();

      if (name.length < 2) {
        alert("نام کامیونیتی را وارد کن.");
        return;
      }

      const communities = getCommunities();

      const newCommunity = {
        id: "community_" + Date.now(),
        name: name,
        description: description || "کامیونیتی جدید",
        members: 1
      };

      communities.push(newCommunity);
      saveCommunities(communities);

      closeCommunityModal();
      renderCommunities();
      renderPostSelect();
      renderPopularCommunities();

      alert("کامیونیتی با موفقیت ساخته شد.");
    }

    function escapeHTML(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    window.onload = function () {
      getCommunities();
      getPosts();

      const savedUser = localStorage.getItem("currentUser");

      if (savedUser) {
        currentUser = savedUser;
        openApp();
      }
    };
  </script>

</body>
</html>
