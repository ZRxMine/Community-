<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Infinite Road</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #07111f;
      font-family: Tahoma, Arial, sans-serif;
      touch-action: none;
    }

    canvas {
      display: block;
    }

    .screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      background:
        radial-gradient(circle at center, rgba(0, 160, 255, .2), transparent 45%),
        linear-gradient(135deg, rgba(2, 7, 20, .97), rgba(10, 35, 65, .97));
    }

    .panel {
      width: min(90%, 430px);
      padding: 30px 22px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 25px;
      background: rgba(255, 255, 255, .1);
      backdrop-filter: blur(15px);
      box-shadow: 0 0 40px rgba(0, 190, 255, .3);
    }

    h1 {
      margin: 0 0 15px;
      color: #6deaff;
      font-size: 38px;
      text-shadow: 0 0 18px #00cfff;
    }

    h2 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #d9f6ff;
      line-height: 2;
    }

    button {
      margin: 7px;
      padding: 14px 23px;
      border: 0;
      border-radius: 15px;
      color: white;
      background: linear-gradient(135deg, #009dff, #723cff);
      box-shadow: 0 5px 18px rgba(0, 130, 255, .4);
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.93);
    }

    #questionScreen,
    #deadScreen {
      display: none;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 5;
      padding: 10px 15px;
      border-radius: 12px;
      color: white;
      background: rgba(0, 0, 0, .5);
      font-size: 14px;
    }

    #help {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 5;
      padding: 10px;
      border-radius: 12px;
      color: #d9f6ff;
      background: rgba(0, 0, 0, .45);
      font-size: 13px;
    }

    #controls {
      position: fixed;
      bottom: 18px;
      left: 50%;
      z-index: 5;
      display: flex;
      gap: 10px;
      direction: ltr;
      transform: translateX(-50%);
    }

    .control {
      width: 78px;
      height: 60px;
      margin: 0;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 18px;
      background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(8px);
      font-size: 26px;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 30px;
      }

      .control {
        width: 68px;
        height: 55px;
      }
    }
  </style>
</head>

<body>

  <!-- صفحه شروع -->
  <div id="startScreen" class="screen">
    <div class="panel">
      <h1>INFINITE ROAD</h1>
      <p>
        در مسیر بی‌نهایت حرکت کن و آدمک مسیر را پیدا کن.
      </p>
      <button id="startButton">Start game</button>
    </div>
  </div>

  <!-- صفحه سؤال -->
  <div id="questionScreen" class="screen">
    <div class="panel">
      <h2>تو بچه‌ای؟</h2>
      <p>یکی از گزینه‌ها را انتخاب کن:</p>
      <button id="kidButton">آره</button>
      <button id="adultButton">من بزرگسالم</button>
    </div>
  </div>

  <!-- صفحه پایان -->
  <div id="deadScreen" class="screen">
    <div class="panel">
      <h1>DID</h1>
      <p>بازی تمام شد!</p>
      <button onclick="location.reload()">دوباره بازی کن</button>
    </div>
  </div>

  <div id="status">مسافت: 0 متر</div>
  <div id="help">W / ↑ برای جلو رفتن</div>

  <!-- کنترل‌ها -->
  <div id="controls">
    <button id="backButton" class="control">◀</button>
    <button id="forwardButton" class="control">▶</button>
    <button id="jumpButton" class="control">⬆</button>
  </div>

  <script type="module">
    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    let scene;
    let camera;
    let renderer;
    let player;

    let gameStarted = false;
    let gamePaused = true;

    let playerSpeed = 0;
    let distance = 0;

    let jumping = false;
    let jumpVelocity = 0;

    let npc = null;
    let npcNumber = 0;

    const keys = {
      forward: false,
      backward: false,
      left: false,
      right: false
    };

    const startScreen = document.getElementById("startScreen");
    const questionScreen = document.getElementById("questionScreen");
    const deadScreen = document.getElementById("deadScreen");
    const status = document.getElementById("status");

    const worldSegments = [];

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      scene.background = new THREE.Color(0x081525);
      scene.fog = new THREE.Fog(0x081525, 25, 160);

      camera = new THREE.PerspectiveCamera(
        65,
        window.innerWidth / window.innerHeight,
        0.1,
        500
      );

      camera.position.set(0, 4.5, -8);

      renderer = new THREE.WebGLRenderer({
        antialias: true
      });

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;

      document.body.appendChild(renderer.domElement);

      createLights();
      createInfiniteRoad();

      player = createCharacter(0x28d7ff);
      player.position.set(0, 0, 2);
      scene.add(player);

      // فقط یک آدمک ساخته می‌شود
      createOneNPC(34);

      setupControls();

      window.addEventListener("resize", resizeGame);
    }

    function createLights() {
      const ambientLight = new THREE.HemisphereLight(
        0x9bdcff,
        0x172238,
        2.2
      );

      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(
        0xffffff,
        2.5
      );

      directionalLight.position.set(15, 30, -20);
      directionalLight.castShadow = true;
      scene.add(directionalLight);

      const blueLight = new THREE.PointLight(
        0x00aaff,
        15,
        70
      );

      blueLight.position.set(0, 8, 20);
      scene.add(blueLight);
    }

    function createInfiniteRoad() {
      const roadMaterial = new THREE.MeshStandardMaterial({
        color: 0x202b3b,
        roughness: .85
      });

      const wallMaterial = new THREE.MeshStandardMaterial({
        color: 0x172945,
        roughness: .65
      });

      const lineMaterial = new THREE.MeshBasicMaterial({
        color: 0x8beeff
      });

      const segmentLength = 25;

      for (let i = 0; i < 14; i++) {
        const segment = new THREE.Group();

        const road = new THREE.Mesh(
          new THREE.BoxGeometry(18, .3, segmentLength),
          roadMaterial
        );

        road.position.y = -.25;
        road.receiveShadow = true;
        segment.add(road);

        const leftWall = new THREE.Mesh(
          new THREE.BoxGeometry(.5, 5, segmentLength),
          wallMaterial
        );

        leftWall.position.set(-9.3, 2.2, 0);
        leftWall.castShadow = true;
        segment.add(leftWall);

        const rightWall = leftWall.clone();
        rightWall.position.x = 9.3;
        segment.add(rightWall);

        for (let z = -10; z <= 10; z += 5) {
          const roadLine = new THREE.Mesh(
            new THREE.BoxGeometry(.16, .04, 2),
            lineMaterial
          );

          roadLine.position.set(0, -.07, z);
          segment.add(roadLine);
        }

        segment.position.z = i * segmentLength;
        worldSegments.push(segment);
        scene.add(segment);
      }
    }

    function createCharacter(color) {
      const character = new THREE.Group();

      const bodyMaterial = new THREE.MeshStandardMaterial({
        color: color,
        roughness: .45,
        metalness: .15
      });

      const skinMaterial = new THREE.MeshStandardMaterial({
        color: 0xffc7a8,
        roughness: .7
      });

      const shoeMaterial = new THREE.MeshStandardMaterial({
        color: 0x111827,
        roughness: .5
      });

      // بدن
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(.42, 1.15, 6, 12),
        bodyMaterial
      );

      body.position.y = 1.45;
      body.castShadow = true;
      character.add(body);

      // سر
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(.43, 20, 16),
        skinMaterial
      );

      head.position.y = 2.65;
      head.castShadow = true;
      character.add(head);

      // چشم‌ها
      const eyeMaterial = new THREE.MeshBasicMaterial({
        color: 0x111111
      });

      const eyeLeft = new THREE.Mesh(
        new THREE.SphereGeometry(.05, 8, 8),
        eyeMaterial
      );

      eyeLeft.position.set(-.15, 2.72, -.38);
      character.add(eyeLeft);

      const eyeRight = eyeLeft.clone();
      eyeRight.position.x = .15;
      character.add(eyeRight);

      // دست‌ها
      const armGeometry = new THREE.CapsuleGeometry(.11, .72, 5, 8);

      const leftArm = new THREE.Mesh(
        armGeometry,
        bodyMaterial
      );

      leftArm.position.set(-.55, 1.45, 0);
      leftArm.rotation.z = -.15;
      leftArm.castShadow = true;
      character.add(leftArm);

      const rightArm = leftArm.clone();
      rightArm.position.x = .55;
      rightArm.rotation.z = .15;
      character.add(rightArm);

      // پاها
      const legGeometry = new THREE.CapsuleGeometry(.14, .85, 5, 8);

      const leftLeg = new THREE.Mesh(
        legGeometry,
        bodyMaterial
      );

      leftLeg.position.set(-.22, .45, 0);
      leftLeg.castShadow = true;
      character.add(leftLeg);

      const rightLeg = leftLeg.clone();
      rightLeg.position.x = .22;
      character.add(rightLeg);

      // کفش‌ها
      const shoeGeometry = new THREE.BoxGeometry(.33, .2, .58);

      const leftShoe = new THREE.Mesh(
        shoeGeometry,
        shoeMaterial
      );

      leftShoe.position.set(-.22, .02, -.15);
      leftShoe.castShadow = true;
      character.add(leftShoe);

      const rightShoe = leftShoe.clone();
      rightShoe.position.x = .22;
      character.add(rightShoe);

      character.userData = {
        leftArm,
        rightArm,
        leftLeg,
        rightLeg
      };

      return character;
    }

    function createOneNPC(zPosition) {
      // اگر آدمک قبلی بود، حذف می‌شود
      if (npc !== null) {
        scene.remove(npc);
        npc = null;
      }

      const colors = [
        0xff4d6d,
        0xffb703,
        0x9b5de5,
        0x00c896
      ];

      npc = createCharacter(colors[npcNumber % colors.length]);
      npcNumber++;

      npc.position.set(0, 0, zPosition);
      npc.rotation.y = Math.PI;

      npc.userData.used = false;

      scene.add(npc);
    }

    function setupControls() {
      document.getElementById("startButton").addEventListener(
        "click",
        () => {
          startScreen.style.display = "none";

          gameStarted = true;
          gamePaused = false;

          // تلپورت بازیکن به جلو
          player.position.z = 10;
          distance = 8;
          updateStatus();
        }
      );

      document.getElementById("kidButton").addEventListener(
        "click",
        () => {
          questionScreen.style.display = "none";
          gamePaused = true;
          deadScreen.style.display = "flex";
        }
      );

      document.getElementById("adultButton").addEventListener(
        "click",
        () => {
          questionScreen.style.display = "none";
          gamePaused = false;

          // آدمک قبلی حذف می‌شود
          if (npc !== null) {
            scene.remove(npc);
            npc = null;
          }

          // فقط یک آدمک جدید جلوتر ساخته می‌شود
          createOneNPC(player.position.z + 55);
        }
      );

      holdButton("forwardButton", "forward");
      holdButton("backButton", "backward");

      document.getElementById("jumpButton").addEventListener(
        "pointerdown",
        jump
      );

      window.addEventListener("keydown", (event) => {
        if (event.code === "ArrowUp" || event.code === "KeyW") {
          keys.forward = true;
        }

        if (event.code === "ArrowDown" || event.code === "KeyS") {
          keys.backward = true;
        }

        if (event.code === "ArrowLeft" || event.code === "KeyA") {
          keys.left = true;
        }

        if (event.code === "ArrowRight" || event.code === "KeyD") {
          keys.right = true;
        }

        if (event.code === "Space") {
          jump();
        }
      });

      window.addEventListener("keyup", (event) => {
        if (event.code === "ArrowUp" || event.code === "KeyW") {
          keys.forward = false;
        }

        if (event.code === "ArrowDown" || event.code === "KeyS") {
          keys.backward = false;
        }

        if (event.code === "ArrowLeft" || event.code === "KeyA") {
          keys.left = false;
        }

        if (event.code === "ArrowRight" || event.code === "KeyD") {
          keys.right = false;
        }
      });

      // اگر انگشت یا ماوس از دکمه خارج شد، حرکت متوقف شود
      window.addEventListener("pointerup", () => {
        keys.forward = false;
        keys.backward = false;
      });
    }

    function holdButton(buttonId, keyName) {
      const button = document.getElementById(buttonId);

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        keys[keyName] = true;
      });

      button.addEventListener("pointerup", () => {
        keys[keyName] = false;
      });

      button.addEventListener("pointerleave", () => {
        keys[keyName] = false;
      });

      button.addEventListener("pointercancel", () => {
        keys[keyName] = false;
      });
    }

    function jump() {
      if (!gameStarted || gamePaused || jumping) {
        return;
      }

      jumping = true;
      jumpVelocity = .23;
    }

    function updatePlayer() {
      if (!gameStarted || gamePaused) {
        return;
      }

      if (keys.forward) {
        playerSpeed += .012;
      } else if (keys.backward) {
        playerSpeed -= .014;
      } else {
        playerSpeed *= .88;
      }

      playerSpeed = THREE.MathUtils.clamp(
        playerSpeed,
        -.18,
        .34
      );

      player.position.z += playerSpeed;

      if (keys.left) {
        player.position.x -= .16;
      }

      if (keys.right) {
        player.position.x += .16;
      }

      player.position.x = THREE.MathUtils.clamp(
        player.position.x,
        -7.5,
        7.5
      );

      // حرکت پرش
      if (jumping) {
        player.position.y += jumpVelocity;
        jumpVelocity -= .012;

        if (player.position.y <= 0) {
          player.position.y = 0;
          jumpVelocity = 0;
          jumping = false;
        }
      }

      const isWalking = Math.abs(playerSpeed) > .025;
      animateCharacter(player, isWalking);

      distance = Math.max(
        0,
        Math.floor(player.position.z - 2)
      );

      updateStatus();

      checkNPCContact();
    }

    function checkNPCContact() {
      if (!gameStarted || gamePaused || npc === null) {
        return;
      }

      if (npc.userData.used) {
        return;
      }

      const xDistance =
        player.position.x - npc.position.x;

      const zDistance =
        player.position.z - npc.position.z;

      // برخورد دایره‌ای؛ از بغل هم رد شوی سؤال باز می‌شود
      const realDistance = Math.sqrt(
        (xDistance * xDistance) +
        (zDistance * zDistance)
      );

      if (realDistance <= 5.5) {
        npc.userData.used = true;
        playerSpeed = 0;
        gamePaused = true;
        questionScreen.style.display = "flex";
      }
    }

    function animateCharacter(character, walking) {
      const parts = character.userData;

      if (!parts) {
        return;
      }

      const time = performance.now() * .012;
      const movement = walking
        ? Math.sin(time) * .55
        : 0;

      parts.leftArm.rotation.x = movement;
      parts.rightArm.rotation.x = -movement;

      parts.leftLeg.rotation.x = -movement;
      parts.rightLeg.rotation.x = movement;
    }

    function updateInfiniteRoad() {
      for (const segment of worldSegments) {
        if (segment.position.z + 25 < player.position.z - 30) {
          segment.position.z += worldSegments.length * 25;
        }
      }
    }

    function updateCamera() {
      const cameraTarget = new THREE.Vector3(
        player.position.x * .35,
        player.position.y + 4.4,
        player.position.z - 8
      );

      camera.position.lerp(cameraTarget, .08);

      const lookTarget = new THREE.Vector3(
        player.position.x,
        player.position.y + 1.4,
        player.position.z + 7
      );

      camera.lookAt(lookTarget);
    }

    function updateStatus() {
      status.textContent = "مسافت: " + distance + " متر";
    }

    function resizeGame() {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    }

    function animate() {
      requestAnimationFrame(animate);

      updatePlayer();
      updateInfiniteRoad();
      updateCamera();

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
