<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova VPN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 20%, #273dff55, transparent 30%),
        radial-gradient(circle at 80% 80%, #ff19c855, transparent 30%),
        linear-gradient(135deg, #080b22, #141044, #09051c);
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .45;
      animation: float 8s ease-in-out infinite alternate;
      z-index: -1;
    }

    body::before {
      background: #164dff;
      top: -180px;
      left: -140px;
    }

    body::after {
      background: #ff0f9d;
      bottom: -180px;
      right: -140px;
      animation-delay: 2s;
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(#ffffffaa 1px, transparent 1px),
        radial-gradient(#ffffff55 1px, transparent 1px);
      background-size: 80px 80px, 130px 130px;
      background-position: 0 0, 30px 40px;
      opacity: .25;
      animation: stars 20s linear infinite;
      z-index: -1;
    }

    .card {
      width: min(92%, 430px);
      padding: 32px 25px;
      text-align: center;
      border: 1px solid #ffffff28;
      border-radius: 30px;
      background: linear-gradient(145deg, #ffffff18, #ffffff08);
      backdrop-filter: blur(22px);
      box-shadow: 0 25px 80px #0008, inset 0 1px #ffffff30;
      animation: appear .8s ease forwards;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 23px;
      font-size: 36px;
      background: linear-gradient(135deg, #566bff, #b91dff);
      box-shadow: 0 0 35px #6c45ff99;
      animation: pulse 2.5s infinite;
    }

    h1 {
      margin-top: 18px;
      font-size: 29px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #c9c9e8;
      margin-top: 8px;
      font-size: 13px;
    }

    .status-box {
      margin: 26px 0 20px;
      padding: 15px;
      border-radius: 18px;
      background: #00000020;
      border: 1px solid #ffffff15;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 15px;
      color: #ff9da8;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4d62;
      box-shadow: 0 0 12px #ff4d62;
    }

    .connected {
      color: #75ffb2 !important;
    }

    .connected .dot {
      background: #27f58b;
      box-shadow: 0 0 15px #27f58b;
    }

    .connect-btn {
      width: 180px;
      height: 180px;
      border: none;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      font-size: 19px;
      font-weight: bold;
      background:
        radial-gradient(circle, #19144d 55%, transparent 56%),
        conic-gradient(#596aff, #d51eff, #596aff);
      box-shadow:
        0 0 0 10px #ffffff0b,
        0 0 45px #744effaa,
        inset 0 0 25px #ffffff25;
      transition: .3s;
      position: relative;
    }

    .connect-btn::after {
      content: "";
      position: absolute;
      inset: -10px;
      border: 1px solid #ffffff25;
      border-radius: 50%;
      animation: ring 2s linear infinite;
    }

    .connect-btn:hover {
      transform: scale(1.06);
      box-shadow:
        0 0 0 12px #ffffff12,
        0 0 65px #a35eff,
        inset 0 0 25px #ffffff35;
    }

    .connect-btn:active {
      transform: scale(.96);
    }

    .connect-btn.loading {
      animation: spin 1.2s linear infinite;
    }

    .connect-btn.on {
      background:
        radial-gradient(circle, #102e2b 55%, transparent 56%),
        conic-gradient(#00e68a, #00b8ff, #00e68a);
      box-shadow: 0 0 55px #00e69caa;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 28px;
    }

    .item {
      padding: 13px 8px;
      border-radius: 15px;
      background: #ffffff0d;
      border: 1px solid #ffffff12;
    }

    .item span {
      display: block;
      color: #aaa9d0;
      font-size: 11px;
      margin-bottom: 6px;
    }

    .item b {
      font-size: 13px;
    }

    .config {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border: 1px solid #ffffff20;
      border-radius: 12px;
      outline: none;
      color: white;
      background: #00000025;
      text-align: center;
    }

    .config::placeholder {
      color: #aaa9c8;
    }

    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #aaa9c8;
    }

    @keyframes float {
      to { transform: translate(80px, 50px) scale(1.15); }
    }

    @keyframes stars {
      to { background-position: 80px 80px, 160px 120px; }
    }

    @keyframes pulse {
      50% { box-shadow: 0 0 55px #8b45ffaa; }
    }

    @keyframes ring {
      to { transform: rotate(360deg); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(25px) scale(.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>

<body>
  <div class="stars"></div>

  <main class="card">
    <div class="logo">🛡️</div>

    <h1>Nova VPN</h1>
    <p class="subtitle">اتصال سریع، امن و خصوصی</p>

    <div class="status-box">
      <div class="status" id="status">
        <i class="dot"></i>
        <span>متصل نیستید</span>
      </div>
    </div>

    <button class="connect-btn" id="connectBtn">
      اتصال
    </button>

    <input
      class="config"
      id="configInput"
      type="text"
      placeholder="نام کانفیگ خود را وارد کنید"
    />

    <section class="info">
      <div class="item">
        <span>موقعیت</span>
        <b id="location">---</b>
      </div>

      <div class="item">
        <span>سرعت</span>
        <b id="speed">---</b>
      </div>

      <div class="item">
        <span>آی‌پی</span>
        <b id="ip">---</b>
      </div>

      <div class="item">
        <span>رمزگذاری</span>
        <b>AES-256</b>
      </div>
    </section>

    <p class="footer">اتصال شما با امنیت بالا محافظت می‌شود</p>
  </main>

  <script>
    const button = document.getElementById("connectBtn");
    const status = document.getElementById("status");
    const configInput = document.getElementById("configInput");

    const locationText = document.getElementById("location");
    const speedText = document.getElementById("speed");
    const ipText = document.getElementById("ip");

    let connected = false;

    button.addEventListener("click", () => {
      const configName = configInput.value.trim();

      if (!configName) {
        configInput.focus();
        configInput.placeholder = "اول نام کانفیگ را وارد کنید!";
        return;
      }

      if (connected) {
        connected = false;

        button.classList.remove("on");
        button.textContent = "اتصال";

        status.classList.remove("connected");
        status.querySelector("span").textContent = "متصل نیستید";

        locationText.textContent = "---";
        speedText.textContent = "---";
        ipText.textContent = "---";

        return;
      }

      button.classList.add("loading");
      button.textContent = "در حال اتصال...";

      status.querySelector("span").textContent = "در حال اتصال";

      setTimeout(() => {
        connected = true;

        button.classList.remove("loading");
        button.classList.add("on");
        button.textContent = "قطع اتصال";

        status.classList.add("connected");
        status.querySelector("span").textContent = "متصل شدید";

        locationText.textContent = "هلند 🇳🇱";
        speedText.textContent = "94 Mbps";
        ipText.textContent = "185.42.19.8";
      }, 1800);
    });

    /*
      برای اتصال واقعی، این بخش باید به بک‌اند وصل شود:

      fetch("/api/connect", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          config: configInput.value
        })
      });
    */
  </script>
</body>
</html>
