<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Config Store | کانفیگ پرسرعت</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #020806;
      --bg2: #06150d;
      --green: #22ff91;
      --green2: #8dffc3;
      --green-dark: #0bc66a;
      --white: #effff6;
      --muted: #91ad9d;
      --border: rgba(34, 255, 145, .2);
      --border-light: rgba(34, 255, 145, .48);
      --red: #ff6881;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 15% 0%, rgba(34,255,145,.17), transparent 370px),
        radial-gradient(circle at 92% 12%, rgba(0,190,105,.14), transparent 360px),
        linear-gradient(135deg, var(--bg), var(--bg2), #010403);
      font-family: "Vazirmatn", Tahoma, sans-serif;
    }

    body.loader-active {
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      opacity: .22;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(34,255,145,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,255,145,.055) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: .24;
      background-image:
        radial-gradient(circle at 12% 23%, var(--green) 0 1px, transparent 2px),
        radial-gradient(circle at 83% 19%, var(--green) 0 1px, transparent 2px),
        radial-gradient(circle at 71% 63%, var(--green) 0 1px, transparent 2px),
        radial-gradient(circle at 24% 78%, var(--green) 0 1px, transparent 2px),
        radial-gradient(circle at 94% 84%, var(--green) 0 1px, transparent 2px);
      background-size: 260px 260px;
      animation: particles 13s linear infinite;
    }

    @keyframes particles {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-260px);
      }
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(34,255,145,.16);
      }

      50% {
        box-shadow: 0 0 0 14px rgba(34,255,145,0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes glow {
      0%, 100% {
        opacity: .45;
        transform: translateX(-50%) scale(1);
      }

      50% {
        opacity: .9;
        transform: translateX(-50%) scale(1.12);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    /* =========================
       Creeper Loading Screen
    ========================= */

    .site-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(34,255,145,.16), transparent 300px),
        linear-gradient(135deg, #010403, #03150b, #010403);
      transition:
        opacity .8s ease,
        visibility .8s ease,
        transform .8s ease;
    }

    .site-loader::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .24;
      background-image:
        linear-gradient(rgba(34,255,145,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,255,145,.07) 1px, transparent 1px);
      background-size: 45px 45px;
      animation: loaderGrid 8s linear infinite;
    }

    .site-loader::after {
      content: "";
      position: absolute;
      width: 430px;
      height: 430px;
      border: 1px solid rgba(34,255,145,.2);
      border-radius: 50%;
      box-shadow:
        0 0 50px rgba(34,255,145,.12),
        inset 0 0 60px rgba(34,255,145,.08);
      animation: loaderRing 4s linear infinite;
    }

    .site-loader.loader-finished {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.15);
      pointer-events: none;
    }

    .loader-content {
      position: relative;
      z-index: 5;
      width: min(450px, 90%);
      text-align: center;
      animation: loaderAppear .8s ease both;
    }

    .loading-title {
      color: var(--white);
      font-size: clamp(25px, 6vw, 42px);
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 25px rgba(34,255,145,.3);
    }

    .loading-title span {
      color: var(--green);
    }

    .loading-subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .creeper-area {
      width: 230px;
      height: 260px;
      margin: 25px auto 15px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      filter: drop-shadow(0 0 22px rgba(34,255,145,.4));
    }

    .creeper {
      position: relative;
      width: 100px;
      height: 210px;
      margin-top: 15px;
      transform-origin: center bottom;
      animation:
        creeperFloat 1.7s ease-in-out infinite,
        creeperShake 3.5s ease-in-out infinite;
    }

    .creeper-head {
      position: absolute;
      top: 0;
      left: 3px;
      width: 94px;
      height: 94px;
      border: 3px solid #0b9f55;
      background: linear-gradient(135deg, #72ffac, #1edb76 58%, #0b8748);
      box-shadow:
        inset 0 0 18px rgba(255,255,255,.2),
        0 0 20px rgba(34,255,145,.35);
    }

    .creeper-eye {
      position: absolute;
      top: 24px;
      width: 17px;
      height: 19px;
      background: #001c0e;
      box-shadow: 0 0 8px rgba(0,0,0,.5);
    }

    .eye-right {
      right: 20px;
    }

    .eye-left {
      left: 20px;
    }

    .creeper-mouth {
      position: absolute;
      background: #001c0e;
    }

    .mouth-one {
      width: 20px;
      height: 19px;
      left: 37px;
      top: 43px;
    }

    .mouth-two {
      width: 19px;
      height: 20px;
      left: 21px;
      top: 59px;
    }

    .mouth-three {
      width: 19px;
      height: 20px;
      right: 21px;
      top: 59px;
    }

    .mouth-four {
      width: 20px;
      height: 17px;
      left: 37px;
      top: 78px;
    }

    .creeper-body {
      position: absolute;
      top: 98px;
      left: 22px;
      width: 56px;
      height: 75px;
      border: 2px solid #0b9f55;
      background: linear-gradient(135deg, #59f99b, #15c969);
      box-shadow: inset 0 0 14px rgba(255,255,255,.15);
    }

    .creeper-leg {
      position: absolute;
      top: 168px;
      width: 25px;
      height: 43px;
      border: 2px solid #087d42;
      background: linear-gradient(135deg, #49ed8c, #0eaf5b);
    }

    .leg-right {
      right: 21px;
    }

    .leg-left {
      left: 21px;
    }

    .loading-progress {
      width: min(300px, 80%);
      height: 6px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(34,255,145,.4);
      border-radius: 20px;
      background: rgba(255,255,255,.06);
      box-shadow: 0 0 15px rgba(34,255,145,.1);
    }

    .loading-progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        var(--green-dark),
        var(--green2),
        var(--green)
      );
      box-shadow: 0 0 15px var(--green);
      animation: loadingProgress 5s linear forwards;
    }

    .loading-percent {
      margin-top: 12px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
    }

    .loading-percent span {
      color: var(--green);
      animation: blinkDot 1s infinite;
    }

    .blast-particle {
      position: absolute;
      top: 105px;
      left: 50%;
      width: 9px;
      height: 9px;
      opacity: 0;
      border-radius: 2px;
      background: var(--green);
      box-shadow: 0 0 13px var(--green);
      transform: translate(-50%, -50%);
    }

    .site-loader.explode .creeper {
      animation: creeperExplosion .75s ease forwards;
    }

    .site-loader.explode .creeper-area::before {
      content: "";
      position: absolute;
      top: 105px;
      left: 50%;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 5px solid var(--green);
      transform: translate(-50%, -50%);
      animation: explosionFlash .7s ease forwards;
    }

    .site-loader.explode .blast-particle {
      animation: particleBlast .9s ease forwards;
    }

    .p1 { --x: -130px; --y: -115px; }
    .p2 { --x: 120px; --y: -120px; }
    .p3 { --x: -155px; --y: -25px; }
    .p4 { --x: 150px; --y: -35px; }
    .p5 { --x: -125px; --y: 80px; }
    .p6 { --x: 130px; --y: 90px; }
    .p7 { --x: -65px; --y: -145px; }
    .p8 { --x: 65px; --y: -150px; }
    .p9 { --x: -80px; --y: 130px; }
    .p10 { --x: 85px; --y: 135px; }
    .p11 { --x: 0px; --y: -165px; }
    .p12 { --x: 0px; --y: 160px; }

    @keyframes loaderAppear {
      from {
        opacity: 0;
        transform: scale(.7) translateY(25px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes loaderGrid {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(45px);
      }
    }

    @keyframes loaderRing {
      from {
        transform: rotate(0deg) scale(.8);
      }

      to {
        transform: rotate(360deg) scale(1.15);
      }
    }

    @keyframes creeperFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-13px);
      }
    }

    @keyframes creeperShake {
      0%, 70%, 100% {
        filter: brightness(1);
      }

      75% {
        filter: brightness(1.5);
      }

      80% {
        filter: brightness(1);
        transform: scale(1.04);
      }

      85% {
        filter: brightness(1.7);
      }
    }

    @keyframes loadingProgress {
      from {
        width: 0%;
      }

      to {
        width: 100%;
      }
    }

    @keyframes blinkDot {
      0%, 100% {
        opacity: .2;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes creeperExplosion {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      45% {
        opacity: 1;
        transform: scale(1.35);
        filter: brightness(2);
      }

      100% {
        opacity: 0;
        transform: scale(2.7) rotate(18deg);
        filter: brightness(4);
      }
    }

    @keyframes explosionFlash {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(.2);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(7);
      }
    }

    @keyframes particleBlast {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      100% {
        opacity: 0;
        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          rotate(360deg)
          scale(.2);
      }
    }

    /* Header */

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 78px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(34,255,145,.16);
      background: rgba(2, 10, 6, .76);
      backdrop-filter: blur(18px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--white);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .5px;
    }

    .logo span {
      color: var(--green);
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(34,255,145,.5);
      border-radius: 14px;
      color: var(--green);
      background: linear-gradient(
        135deg,
        rgba(34,255,145,.18),
        rgba(34,255,145,.03)
      );
      box-shadow:
        0 0 25px rgba(34,255,145,.18),
        inset 0 0 15px rgba(34,255,145,.1);
      font-size: 24px;
      animation: pulse 3s infinite;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-link {
      padding: 10px 14px;
      color: var(--muted);
      border-radius: 9px;
      font-size: 12px;
      transition: .25s;
    }

    .nav-link:hover {
      color: var(--green);
      background: rgba(34,255,145,.08);
    }

    .redeem-button {
      padding: 11px 16px;
      border: 1px solid rgba(34,255,145,.38);
      border-radius: 9px;
      color: var(--green2);
      background: rgba(34,255,145,.07);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: .25s;
    }

    .redeem-button:hover {
      color: #00170b;
      background: var(--green);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(34,255,145,.2);
    }

    /* Hero */

    .hero {
      position: relative;
      width: min(1150px, 90%);
      min-height: 555px;
      margin: auto;
      padding: 95px 0 90px;
      display: flex;
      align-items: center;
      text-align: center;
      animation: appear .9s ease both;
    }

    .hero-content {
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding: 9px 15px;
      border: 1px solid rgba(34,255,145,.31);
      border-radius: 50px;
      color: var(--green);
      background: rgba(34,255,145,.07);
      box-shadow: 0 0 25px rgba(34,255,145,.07);
      font-size: 11px;
      font-weight: 700;
    }

    .hero-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 13px var(--green);
      animation: pulse 2s infinite;
    }

    .hero h1 {
      max-width: 850px;
      margin: auto;
      font-size: clamp(34px, 6vw, 69px);
      font-weight: 900;
      line-height: 1.42;
      letter-spacing: -1px;
    }

    .hero h1 span {
      color: var(--green);
      text-shadow: 0 0 28px rgba(34,255,145,.35);
    }

    .hero-description {
      max-width: 650px;
      margin: 23px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 2.2;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 31px;
    }

    .primary-button,
    .secondary-button {
      min-width: 155px;
      padding: 13px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 900;
      transition: .25s;
    }

    .primary-button {
      color: #00170b;
      background: linear-gradient(110deg, var(--green), var(--green2));
      box-shadow: 0 10px 28px rgba(34,255,145,.14);
    }

    .secondary-button {
      border: 1px solid var(--border-light);
      color: var(--green2);
      background: rgba(255,255,255,.035);
      cursor: pointer;
    }

    .primary-button:hover,
    .secondary-button:hover {
      transform: translateY(-4px);
    }

    .secondary-button:hover {
      color: #00170b;
      background: var(--green);
    }

    .hero-orb {
      position: absolute;
      width: 300px;
      height: 300px;
      top: 105px;
      left: 50%;
      z-index: 0;
      border: 1px solid rgba(34,255,145,.13);
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow:
        0 0 90px rgba(34,255,145,.08),
        inset 0 0 60px rgba(34,255,145,.05);
      animation: glow 5s ease-in-out infinite;
    }

    .hero-orb::before,
    .hero-orb::after {
      content: "";
      position: absolute;
      inset: -45px;
      border: 1px solid rgba(34,255,145,.08);
      border-radius: 50%;
    }

    .hero-orb::after {
      inset: -90px;
      border-color: rgba(34,255,145,.045);
    }

    /* Statistics */

    .stats {
      width: min(950px, 90%);
      margin: -23px auto 78px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      position: relative;
      z-index: 3;
    }

    .stat {
      padding: 18px 15px;
      border-left: 1px solid rgba(34,255,145,.16);
      background: rgba(7, 24, 13, .55);
      text-align: center;
    }

    .stat:first-child {
      border-radius: 14px 0 0 14px;
    }

    .stat:last-child {
      border-left: 0;
      border-radius: 0 14px 14px 0;
    }

    .stat strong {
      display: block;
      color: var(--green);
      font-size: 22px;
      font-weight: 900;
    }

    .stat span {
      color: var(--muted);
      font-size: 10px;
    }

    /* Products */

    .section {
      width: min(1150px, 90%);
      margin: auto;
      padding-bottom: 88px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .section-heading h2 {
      color: var(--white);
      font-size: 27px;
      font-weight: 900;
    }

    .section-heading h2 span {
      color: var(--green);
    }

    .section-heading p {
      color: var(--muted);
      font-size: 12px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .product-card {
      position: relative;
      overflow: hidden;
      min-height: 355px;
      padding: 25px 22px 21px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 21px;
      background: linear-gradient(
        145deg,
        rgba(17,49,29,.9),
        rgba(5,15,9,.96)
      );
      transition: .35s ease;
      animation: float 6s ease-in-out infinite;
    }

    .product-card:nth-child(2) {
      animation-delay: -2s;
    }

    .product-card:nth-child(3) {
      animation-delay: -4s;
    }

    .product-card::before {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      top: -90px;
      left: -60px;
      border-radius: 50%;
      background: rgba(34,255,145,.13);
      filter: blur(28px);
      transition: .35s;
    }

    .product-card::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 180%;
      top: -40%;
      left: -100%;
      opacity: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.08),
        transparent
      );
      transform: rotate(20deg);
      transition: .4s;
    }

    .product-card:hover {
      border-color: var(--border-light);
      transform: translateY(-12px) scale(1.015);
      box-shadow:
        0 20px 45px rgba(0,0,0,.33),
        0 0 30px rgba(34,255,145,.08);
      animation-play-state: paused;
    }

    .product-card:hover::after {
      left: 130%;
      opacity: 1;
    }

    .product-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 23px;
    }

    .product-icon {
      width: 61px;
      height: 61px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(34,255,145,.42);
      border-radius: 17px;
      color: var(--green);
      background: rgba(34,255,145,.1);
      box-shadow: 0 0 27px rgba(34,255,145,.08);
      font-size: 29px;
    }

    .product-number {
      color: rgba(186,255,220,.45);
      font-size: 12px;
      font-weight: 900;
    }

    .product-card h3 {
      position: relative;
      z-index: 1;
      margin-bottom: 12px;
      font-size: 21px;
      font-weight: 900;
    }

    .product-card > p {
      position: relative;
      z-index: 1;
      min-height: 76px;
      color: var(--muted);
      font-size: 12px;
      line-height: 2;
    }

    .tag-list {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 17px;
    }

    .tag {
      padding: 6px 9px;
      border: 1px solid rgba(34,255,145,.16);
      border-radius: 7px;
      color: var(--green2);
      background: rgba(34,255,145,.055);
      font-size: 10px;
    }

    .product-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      padding-top: 19px;
      border-top: 1px solid rgba(34,255,145,.14);
    }

    .product-price {
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
    }

    .product-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 13px;
      border-radius: 9px;
      color: #00170b;
      background: var(--green);
      font-size: 11px;
      font-weight: 900;
      transition: .25s;
    }

    .product-button:hover {
      background: var(--green2);
      transform: translateY(-3px);
      box-shadow: 0 7px 18px rgba(34,255,145,.22);
    }

    /* Advantages */

    .advantages {
      width: min(1150px, 90%);
      margin: 0 auto 86px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .advantage {
      padding: 23px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(8, 26, 15, .69);
      transition: .3s;
    }

    .advantage:hover {
      border-color: var(--border-light);
      background: rgba(16, 50, 28, .8);
      transform: translateY(-6px);
    }

    .advantage-icon {
      margin-bottom: 14px;
      color: var(--green);
      font-size: 25px;
    }

    .advantage h3 {
      margin-bottom: 9px;
      font-size: 14px;
    }

    .advantage p {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.9;
    }

    /* Redeem Modal */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.8);
      backdrop-filter: blur(9px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(430px, 100%);
      padding: 29px 23px;
      border: 1px solid rgba(34,255,145,.45);
      border-radius: 21px;
      background: linear-gradient(145deg, #12321f, #061009);
      box-shadow: 0 20px 75px rgba(0,0,0,.5);
      text-align: center;
      animation: appear .3s ease both;
    }

    .modal-box h2 {
      margin-bottom: 10px;
      color: var(--green);
      font-size: 23px;
    }

    .modal-box p {
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 2;
    }

    .redeem-input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      outline: none;
      border: 1px solid rgba(34,255,145,.27);
      border-radius: 10px;
      color: var(--green2);
      background: rgba(0,0,0,.25);
      font-family: inherit;
      font-size: 14px;
      text-align: center;
      direction: ltr;
    }

    .redeem-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(34,255,145,.08);
    }

    .submit-redeem {
      width: 100%;
      height: 48px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      color: #00170b;
      background: var(--green);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .submit-redeem:hover {
      background: var(--green2);
    }

    .redeem-result {
      min-height: 24px;
      margin-top: 14px;
      font-size: 12px;
      line-height: 1.8;
    }

    .success {
      color: var(--green);
    }

    .error {
      color: var(--red);
    }

    .close-button {
      width: 100%;
      height: 44px;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--white);
      background: rgba(255,255,255,.04);
      font-size: 12px;
      cursor: pointer;
    }

    footer {
      padding: 27px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }

      .advantages {
        grid-template-columns: repeat(2, 1fr);
      }

      .product-card:last-child {
        grid-column: span 2;
      }
    }

    @media (max-width: 600px) {
      .site-loader::after {
        width: 290px;
        height: 290px;
      }

      header {
        padding: 0 4%;
      }

      .logo {
        font-size: 12px;
      }

      .logo-icon {
        width: 37px;
        height: 37px;
      }

      .nav-link {
        display: none;
      }

      .redeem-button {
        padding: 9px 10px;
        font-size: 10px;
      }

      .hero {
        min-height: 520px;
        padding-top: 72px;
      }

      .hero h1 {
        font-size: 35px;
      }

      .hero-description {
        font-size: 12px;
      }

      .hero-buttons {
        flex-direction: column;
      }

      .primary-button,
      .secondary-button {
        width: 210px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat,
      .stat:first-child,
      .stat:last-child {
        border: 1px solid rgba(34,255,145,.14);
        border-radius: 0;
      }

      .stat:first-child {
        border-radius: 12px 0 0 0;
      }

      .stat:nth-child(2) {
        border-radius: 0 12px 0 0;
      }

      .stat:nth-child(3) {
        border-radius: 0 0 0 12px;
      }

      .stat:last-child {
        border-radius: 0 0 12px 0;
      }

      .section-heading {
        display: block;
      }

      .section-heading p {
        margin-top: 8px;
      }

      .products,
      .advantages {
        grid-template-columns: 1fr;
      }

      .product-card:last-child {
        grid-column: auto;
      }
    }
  </style>
</head>
