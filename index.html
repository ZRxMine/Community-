<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سکه عضو بگیر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .profile {
            text-align: center;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: white;
            margin: 0 auto 15px;
        }
        .name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .phone {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .coins {
            background: #f0f4ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .coins h3 {
            color: #667eea;
            margin-bottom: 5px;
        }
        .back {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- مرحله ۱: ورود شماره -->
        <div class="step active" id="step1">
            <h1>🪙 سکه عضو بگیر</h1>
            <p class="subtitle">شماره روبیکات رو وارد کن تا پروفایلت بیاد</p>
            <label>شماره موبایل</label>
            <input type="tel" id="phoneInput" placeholder="09xxxxxxxxx" maxlength="11">
            <div class="error" id="errorMsg">شماره معتبر نیست!</div>
            <button class="btn" onclick="checkPhone()">ادامه</button>
        </div>

        <!-- مرحله ۲: پروفایل -->
        <div class="step" id="step2">
            <div class="profile">
                <div class="avatar">👤</div>
                <div class="name" id="profileName">کاربر روبیکا</div>
                <div class="phone" id="profilePhone"></div>
                <div class="coins">
                    <h3>🪙 ۵۰ سکه</h3>
                    <p>به خاطر عضویتت هدیه گرفتی!</p>
                </div>
                <button class="btn" onclick="goBack()">برگشت</button>
            </div>
        </div>
    </div>

    <script>
        function checkPhone() {
            const phone = document.getElementById('phoneInput').value;
            const error = document.getElementById('errorMsg');
            
            // بررسی ساده شماره ایرانی
            if (/^09\d{9}$/.test(phone)) {
                error.style.display = 'none';
                document.getElementById('profilePhone').textContent = phone;
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
            } else {
                error.style.display = 'block';
            }
        }

        function goBack() {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
        }
    </script>
</body>
</html>
